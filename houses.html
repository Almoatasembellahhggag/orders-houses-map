<style>
/* After the Gutenberg Bible: black textura on vellum, headings as rubrics in red, initials in red and blue.
   Page titles are set in a blackletter (Grenze Gotisch), names and reading text in Texturina, a textura drawn
   to be read on screen, initials in an uncial; controls and figures stay in a plain sans. */
:root {
  --paper: #ece2c9; --panel: #f5eedb; --ink: #1c1611; --muted: #6b5f50; --rule: #cfc4ad;
  --sea: #c5d1cd; --land: #e6dfcc; --land-edge: #b9ae95; --region: #f4eddb; --region-edge: #8a7c60; --river: #9fb6b8;
  --accent: #1f4079; --accent-soft: #dadccd; --rubric: #b3221a; --bad: #b3221a; --bad-soft: #f0dacd; --good-soft: #dfe4c9;
  --o-hosp: #2b2723; --o-temp: #a3271b; --o-teut: #a37a12; --o-carm: #6b4226;
  --display: "Texturina", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --title: "Grenze Gotisch", "Texturina", Georgia, serif;
  --initial: "Uncial Antiqua", "Texturina", Georgia, serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: var(--body);
  --shadow: 0 1px 2px rgba(60, 45, 25, .10), 0 6px 18px rgba(60, 45, 25, .12);
  --ctrl-filter: none;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1b1714; --panel: #241f1a; --ink: #e8dfcb; --muted: #a79b8a; --rule: #40372d;
  --sea: #10191c; --land: #2a2520; --land-edge: #4a4035; --region: #38312a; --region-edge: #93866f; --river: #33505a;
  --accent: #a3bdd4; --accent-soft: #2b3640; --rubric: #dc7a66; --bad: #e08a7a; --bad-soft: #3d2420; --good-soft: #2b3222;
  --o-hosp: #d8d0c0; --o-temp: #ef6f61; --o-teut: #e2b33f; --o-carm: #c99a6c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .45); --ctrl-filter: invert(.9); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #1b1714; --panel: #241f1a; --ink: #e8dfcb; --muted: #a79b8a; --rule: #40372d;
  --sea: #10191c; --land: #2a2520; --land-edge: #4a4035; --region: #38312a; --region-edge: #93866f; --river: #33505a;
  --accent: #a3bdd4; --accent-soft: #2b3640; --rubric: #dc7a66; --bad: #e08a7a; --bad-soft: #3d2420; --good-soft: #2b3222;

html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--body); font-variant-numeric: tabular-nums; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

[hidden] { display: none !important; }
.eyebrow { font: 600 14px/1.15 var(--display); letter-spacing: .01em; color: var(--rubric); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; }
.btn { border: 1px solid var(--rule); background: var(--paper); border-radius: 3px; padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.dots { display: inline-flex; gap: 3px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
.dot.unc { background: transparent; border: 1.5px dashed var(--c); }
.tag { font: 500 11.5px var(--mono); padding: 2px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--ink); }
.tag.warn { background: var(--bad-soft); color: var(--bad); }
.tag.ok { background: var(--good-soft); }
.emblem { display: inline-block; vertical-align: middle; flex: none; }
.emblem.unc { opacity: .5; }
.theme-btn { width: 30px; height: 30px; flex: none; display: grid; place-items: center; padding: 0; border: 1px solid var(--rule); border-radius: 50%; background: var(--paper); color: var(--ink); cursor: pointer; }
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }
.theme-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.crumbs { display: flex; gap: 14px; font: 500 14.5px/1 var(--display); }
.crumbs a { color: var(--accent); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.crumbs a[aria-current] { color: var(--ink); }

/* Layout: an index, as at the back of a book. A slim navigation bar, the title with search and order filters,
   then one row per house; each row opens that house's full record. */
body { min-height: 100%; }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule); }
.nav-in { max-width: 1040px; margin: 0 auto; padding: 10px 24px; display: flex; gap: 10px; align-items: center; }
.nav .sp { flex: 1; }
.page { max-width: 1040px; margin: 0 auto; padding-inline: 24px; padding-block: 26px 56px; display: grid; gap: 18px; }
h1 { margin: 0; font: 700 clamp(32px, 5vw, 46px)/1.05 var(--title); }
.tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.search { position: relative; flex: 1 1 280px; max-width: 420px; }
.search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); font-size: 15px; }
.search input:focus-visible { outline: none; border-color: var(--accent); }
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.of { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: var(--panel); border-radius: 3px; padding: 3px 11px 3px 4px; font-size: 13.5px; cursor: pointer; }
.of[aria-pressed="false"] { opacity: .45; }
.of[aria-pressed="false"] .emblem { filter: grayscale(1); }
.sort { border: 1px solid var(--rule); background: var(--panel); border-radius: 4px; padding: 7px 8px; font-size: 13.5px; margin-left: auto; }
.count { font-size: 13.5px; color: var(--muted); }
.count b { color: var(--ink); }
.index { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.index a { display: grid; grid-template-columns: 54px minmax(0, 1.5fr) minmax(0, 1.6fr) 118px 92px; gap: 14px; align-items: center; padding: 11px 10px; border-bottom: 1px solid var(--rule); color: var(--ink); text-decoration: none; }
.index a:hover, .index a:focus-visible { background: var(--accent-soft); }
.index .name { font: 500 18px/1.2 var(--display); min-width: 0; }
.index .why { display: block; font: 400 12.5px var(--body); color: var(--accent); margin-top: 2px; }
.index .what { font-size: 14px; color: var(--muted); min-width: 0; }
.index .what b { color: var(--ink); font-weight: 500; }
.index .yrs { font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.index .n { font-size: 13px; color: var(--muted); text-align: right; }
.empty { padding: 26px 10px; color: var(--muted); }
@media (max-width: 760px) {
  .page { padding-inline: 16px; }
  .nav-in { padding: 8px 16px; }
  .index a { grid-template-columns: 46px minmax(0, 1fr) auto; gap: 4px 12px; }
  .index .what { grid-column: 2 / -1; }
  .index .n { display: none; }
  .sort { margin-left: 0; }
}
</style>

function timelineSvg(h, year = null) {
  const W = 360, x = y => 4 + (y - MIN_Y) / (MAX_Y - MIN_Y) * (W - 8);
  const rows = h.periods.filter(p => p.start != null);
  const bars = rows.map((p, i) => {

const EMBLEM = {

const quarter = d => [0, 90, 180, 270].map(a => `<path d="${d}" transform="rotate(${a} 12 12)"/>`).join("");

  const a = -Math.PI / 2 + i * Math.PI / 5, d = i % 2 ? r : R;
  return `${(cx + d * Math.cos(a)).toFixed(2)} ${(cy + d * Math.sin(a)).toFixed(2)}`;
}).join("L") + "Z";
const EMBLEM_INK = {
  hosp: quarter("M12 12 8.2 3.5 12 5.7 15.8 3.5Z"),               // each arm: two points with a V notch

};
function emblem(o, size = 22, uncertain = false) {
  const e = EMBLEM[o];
  return `<svg class="emblem${uncertain ? " unc" : ""}" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">`

function initThemeToggle(btn) {
  const sun = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.4M10 15.8v2.4M1.8 10h2.4M15.8 10h2.4M4.2 4.2l1.700 1.700M14.1 14.1l1.700 1.700M4.2 15.8l1.700-1.700M14.1 5.900l1.700-1.700"/></svg>';
  const moon = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.300A7 7 0 0 1 7.700 3.500a7 7 0 1 0 8.800 8.800Z"/></svg>';
  const paint = () => {
    const dark = currentTheme() === "dark";
    btn.innerHTML = dark ? sun : moon;
    btn.title = dark ? "Switch to the light theme" : "Switch to the dark theme";
    btn.setAttribute("aria-label", btn.title);
  };
  btn.onclick = () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch {}
    paint();
  };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
  paint();
}

// ---------- spelling-tolerant search ----------
const fold = s => String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
  .replace(/ß/g, "ss").replace(/ae/g, "a").replace(/oe/g, "o").replace(/ue/g, "u")
  .replace(/[zß]/g, "s").replace(/ck|c|q/g, "k").replace(/th/g, "t").replace(/y/g, "i").replace(/(.)\1+/g, "$1");
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      best = Math.min(best, cur[j]);
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
function wordMatch(q, text) {
  const t = fold(text);
  if (t.includes(q)) return true;
  if (q.length < 5) return false;
  const tol = q.length >= 9 ? 2 : 1;
  return t.split(/[^a-z]+/).some(w => w.length >= 4 && (lev(q, w, tol) <= tol || (w.length > q.length && lev(q, w.slice(0, q.length), tol) <= tol)));
}
for (const h of houses) {
  h.index = [
    { why: null, text: h.label }, ...h.aliases.map(a => ({ why: "also written " + a, text: a })),
    { why: null, text: h.id },
    ...h.people.map(p => ({ why: "office holder: " + p.name, text: p.name })),
  ];
}
function searchHit(h, raw) {
  const words = fold(raw).split(/\s+/).filter(Boolean);
  if (!words.length) return { ok: true };
  for (const entry of h.index) if (words.every(w => wordMatch(w, entry.text))) return { ok: true, why: entry.why };
  return { ok: false };
}


const state = { q: "", orders: new Set(ORDER_KEYS), sort: "name" };
const mine = houses.filter(h => !h.external && h.status === "checked");   // the same houses the map shows
function renderFilters() {
  $("#filters").innerHTML = ORDER_KEYS.map(o => `<button class="of" data-o="${o}" aria-pressed="${state.orders.has(o)}">${emblem(o, 22)}${DATA.orders[o]}</button>`).join("");
}
const sorters = {
  name: (a, b) => a.label.localeCompare(b.label, "de") || (a.start ?? 0) - (b.start ?? 0),
  start: (a, b) => (a.start ?? 9999) - (b.start ?? 9999) || a.label.localeCompare(b.label, "de"),
  people: (a, b) => b.people.length - a.people.length || a.label.localeCompare(b.label, "de"),
};
function render() {
  const rows = mine.map(h => [h, searchHit(h, state.q)]).filter(([h, v]) => v.ok && h.orders.some(o => state.orders.has(o))).sort(([a], [b]) => sorters[state.sort](a, b));
  $("#count").innerHTML = `<b>${rows.length}</b> of ${mine.length} houses`;
  $("#index").innerHTML = rows.length ? rows.map(([h, v]) => `<li><a href="${houseUrl(h.id)}">
      <span class="dots">${h.periods.map(p => emblem(p.order, 24, p.uncertain)).join("")}</span>
      <span class="name">${esc(h.label)}${v.why ? `<span class="why">${esc(v.why)}</span>` : ""}</span>
      <span class="what"><b>${esc(h.periods.map(p => DATA.orders[p.order] + (p.uncertain ? " (?)" : "")).join(" → "))}</b> · ${esc(h.type)}${h.status === "excluded" ? ' · <span class="tag warn">excluded</span>' : ""}</span>
      <span class="yrs">${esc(range(h))}</span>
      <span class="n">${h.people.length ? h.people.length + " office holder" + (h.people.length === 1 ? "" : "s") : ""}</span></a></li>`).join("")
    : `<li class="empty">No house matches. Clear the search or switch an order back on.</li>`;
}
$("#q").oninput = e => { state.q = e.target.value; render(); };
$("#sort").onchange = e => { state.sort = e.target.value; render(); };
$("#filters").onclick = e => { const b = e.target.closest("[data-o]"); if (!b) return; const o = b.dataset.o;
  state.orders.has(o) && state.orders.size > 1 ? state.orders.delete(o) : state.orders.add(o); renderFilters(); render(); };
initThemeToggle($("#themeBtn"));
renderFilters(); render();
</script>
