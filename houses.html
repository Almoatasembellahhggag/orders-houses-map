<style>
/* After the Lorsch Gospels (Codex Aureus of Lorsch, c. 810). The colours are measured from its pages: the vellum,
   the brown-gold of the letters, the minium orange and the dark blue of the frames. The entry page is built on
   the plan of its "Incipit argumentum" page: two columns between painted pillars. The type is Cardo, a face made for medievalists
   and classicists; controls and figures stay in a plain sans. */
:root {
  --paper: #e9dec4; --panel: #f3ead5; --ink: #2a2018; --muted: #6c5d48; --rule: #cdbd9b;
  --sea: #c5d1cd; --land: #e6dfcc; --land-edge: #b9ae95; --region: #f4eddb; --region-edge: #8a7c60; --river: #9fb6b8;
  --accent: #3c3a63; --accent-soft: #dfd8cc; --rubric: #ad4a22; --gold: #765622; --purple: #33304f; --on-purple: #efe3c4;
  --bad: #ad4a22; --bad-soft: #f2dccb; --good-soft: #dfe4c9;
  --o-hosp: #2b2723; --o-temp: #a3271b; --o-teut: #a37a12; --o-carm: #6b4226;
  --display: "Cardo", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --title: var(--display);
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: var(--body);
  --shadow: 0 1px 2px rgba(60, 45, 25, .10), 0 6px 18px rgba(60, 45, 25, .12);
  --ctrl-filter: none;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1b1819; --panel: #232021; --ink: #e9e2d2; --muted: #a79d8c; --rule: #403a38;
  --sea: #10191c; --land: #2a2520; --land-edge: #4a4035; --region: #38312a; --region-edge: #93866f; --river: #33505a;
  --accent: #c9b06a; --accent-soft: #37302c; --rubric: #e08660; --gold: #c9a55a; --purple: #3d3a5c; --on-purple: #efe3c4;
  --bad: #ee8a70; --bad-soft: #44231f; --good-soft: #2b3222;
  --o-hosp: #d8d0c0; --o-temp: #ef6f61; --o-teut: #e2b33f; --o-carm: #c99a6c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 6px 18px rgba(0, 0, 0, .5); --ctrl-filter: invert(.9); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #1b1819; --panel: #232021; --ink: #e9e2d2; --muted: #a79d8c; --rule: #403a38;
  --sea: #10191c; --land: #2a2520; --land-edge: #4a4035; --region: #38312a; --region-edge: #93866f; --river: #33505a;
  --accent: #c9b06a; --accent-soft: #37302c; --rubric: #e08660; --gold: #c9a55a; --purple: #3d3a5c; --on-purple: #efe3c4;
  --bad: #ee8a70; --bad-soft: #44231f; --good-soft: #2b3222;
  --o-hosp: #d8d0c0; --o-temp: #ef6f61; --o-teut: #e2b33f; --o-carm: #c99a6c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 6px 18px rgba(0, 0, 0, .5); --ctrl-filter: invert(.9); color-scheme: dark; }

html { cursor: var(--quill); }
a, button, summary, select, label[for], input[type="checkbox"], input[type="range"] { cursor: var(--hand); }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--body); font-variant-numeric: tabular-nums; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

[hidden] { display: none !important; }
.eyebrow { font: 400 15px/1.15 var(--display); color: var(--rubric); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: var(--hand); font-size: 13px; }
.btn { border: 1px solid var(--rule); background: var(--paper); border-radius: 3px; padding: 5px 11px; cursor: var(--hand); font-size: 13px; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--purple); border-color: var(--purple); color: var(--on-purple); }
.dots { display: inline-flex; gap: 3px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
.dot.unc { background: transparent; border: 1.5px dashed var(--c); }
.tag { font: 500 11.5px var(--mono); padding: 2px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--ink); }
.tag.warn { background: var(--bad-soft); color: var(--bad); }
.tag.ok { background: var(--good-soft); }
.emblem { display: inline-block; vertical-align: middle; flex: none; }
.emblem.unc { opacity: .5; }
/* the theme switch: a candle standing in a small round-arched niche */
.theme-btn { width: 40px; height: 46px; flex: none; display: grid; place-items: end center; padding: 0 0 8px; border: 1px solid var(--rule); border-radius: 15px 15px 3px 3px; background: var(--paper); color: var(--ink); cursor: var(--hand); box-shadow: inset 0 0 0 2px var(--panel), inset 0 0 0 3px var(--rule); }
.theme-btn:hover { border-color: var(--accent); }
.theme-btn svg:not(.gable) { width: 25px; height: 30px; display: block; overflow: visible; }
/* The flame flickers while it burns, shrinks into the wick when snuffed and leaves a thread of smoke; lighting it
   makes it spring back up and warms the niche. */
.theme-btn { position: relative; overflow: hidden; }
.theme-btn::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 36%, rgba(248, 214, 130, .75), transparent 62%); transition: opacity .5s; }
.theme-btn.snuffed::before { opacity: 0; }
.theme-btn svg:not(.gable) { position: relative; filter: drop-shadow(0 1.5px 1px rgba(30, 18, 5, .4)); }
.theme-btn .flame { transform-box: view-box; transform-origin: 10px 10.6px; transition: transform .38s cubic-bezier(.3, 1.6, .5, 1), opacity .2s; animation: candle-flicker 8s ease-in-out infinite; }
.theme-btn.snuffed .flame { transform: scale(0); opacity: 0; animation: none; transition: transform .28s ease-in, opacity .28s; }
.theme-btn .smoke { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; }
.theme-btn.snuffed .smoke { animation: candle-smoke 1.5s .15s ease-out forwards; }
.theme-btn .spark { opacity: 0; transform-box: view-box; transform-origin: 10px 9px; }
.theme-btn.lighting .spark { animation: candle-spark .5s ease-out; }
.theme-btn.lighting .flame { animation: candle-catch .85s cubic-bezier(.3, 1.3, .5, 1) both, candle-flicker 8s .85s ease-in-out infinite; }
.theme-btn:not(.snuffed)::before { animation: candle-glow-flicker 7s ease-in-out infinite; }
.theme-btn.lighting::before { animation: candle-glow .9s ease-out both, candle-glow-flicker 7s .9s ease-in-out infinite; }
@keyframes candle-spark { 0% { opacity: 0; transform: scale(.2); } 30% { opacity: 1; transform: scale(.8); } 100% { opacity: 0; transform: scale(1.5); } }
@keyframes candle-catch { 0%, 22% { transform: scale(0); opacity: 0; } 30% { transform: scale(.25); opacity: 1; } 62% { transform: scale(1.18, 1.3); } 80% { transform: scale(.94, .92); } 100% { transform: scale(1); opacity: 1; } }
@keyframes candle-glow { 0%, 22% { opacity: 0; transform: scale(.4); } 60% { opacity: 1; transform: scale(1.25); } 100% { opacity: 1; transform: scale(1); } }
/* A candle in still air: the flame leans and breathes slowly, while its shape drifts. */
@keyframes candle-flicker { 0%, 100% { transform: none; } 20% { transform: skewX(-1deg) scaleY(1.02); } 45% { transform: skewX(.8deg) scaleY(.99); } 70% { transform: skewX(1.2deg) scaleY(1.025); } 88% { transform: skewX(-.6deg) scaleY(1); } }
@keyframes candle-glow-flicker { 0%, 100% { opacity: 1; } 35% { opacity: .92; } 70% { opacity: .97; } }
@keyframes candle-smoke { 0% { stroke-dashoffset: 1; opacity: 0; } 25% { opacity: .9; } 70% { stroke-dashoffset: 0; opacity: .9; } 100% { stroke-dashoffset: 0; opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .theme-btn .flame, .theme-btn.lighting .flame, .theme-btn.lighting .spark, .theme-btn.lighting::before, .theme-btn:not(.snuffed)::before, .theme-btn.snuffed .smoke { animation: none; transition: none; } .theme-btn.snuffed .smoke { stroke-dashoffset: 0; opacity: .55; } }
.crumbs { display: flex; gap: 14px; font: 400 16px/1 var(--display); }
.crumbs a { color: var(--accent); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.crumbs a[aria-current] { color: var(--ink); }
/* the language switch: one niche with a reel of two capitals (D over E); the reel slides and tilts when it turns */
.lang { position: relative; overflow: hidden; flex: none; width: 30px; height: 34px; padding: 0; border: 1px solid var(--rule); border-radius: 15px 15px 3px 3px; background: var(--paper); box-shadow: inset 0 0 0 2px var(--panel), inset 0 0 0 3px var(--rule); cursor: var(--hand); display: block; }
.lang:hover { border-color: var(--accent); }
.lang::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 55%, rgba(248, 214, 130, .45), transparent 75%); pointer-events: none; }
.lang .reel { position: absolute; left: 0; right: 0; top: 0; height: 200%; display: flex; flex-direction: column; transition: transform .6s cubic-bezier(.5, -0.4, .3, 1.35); }
.lang .reel > span { flex: 1; display: grid; place-items: center; padding-top: 9px; font: 700 25px/1 var(--display); filter: drop-shadow(0 1.5px 1px rgba(30, 18, 5, .45)); color: #e2bd62; -webkit-text-stroke: 1.6px #2a2018; paint-order: stroke fill; }
.lang.shuffle .reel > span { animation: lang-shuffle .6s ease-in-out; }
@keyframes lang-shuffle { 0%, 100% { rotate: 0deg; } 30% { rotate: -9deg; } 65% { rotate: 7deg; } }
@media (prefers-reduced-motion: reduce) { .lang .reel { transition: none; } .lang.shuffle .reel > span { animation: none; } }
/* the music switch: a niche like the language ones, holding a note; it rings when the music plays */
.music-btn { position: relative; overflow: hidden; width: 32px; height: 34px; flex: none; display: grid; place-items: center; padding: 3px 0 0; border: 1px solid var(--rule); border-radius: 16px 16px 3px 3px; background: var(--paper); box-shadow: inset 0 0 0 2px var(--panel), inset 0 0 0 3px var(--rule); color: var(--ink); cursor: var(--hand); }
.music-btn:hover { border-color: var(--accent); }
.music-btn > svg:first-child { width: 22px; height: 24px; margin-top: 12px; translate: 1px 0; filter: drop-shadow(0 1.5px 1px rgba(30, 18, 5, .45)); display: block; opacity: .95; color: #2a2018; }
.music-btn { overflow: visible; }
.music-btn[aria-pressed="false"] > svg:first-child { opacity: .95; }
/* while the music plays, notes drift up out of the harp and fade */
.music-btn .note { position: absolute; left: 50%; bottom: 50%; width: 11px; height: 16px; opacity: 0; pointer-events: none; color: var(--gold); }
.music-btn[aria-pressed="true"] .note { animation: note-rise 3.6s ease-out infinite; }
.music-btn .n2 { margin-left: -9px; animation-delay: 1.2s !important; }
.music-btn .n3 { margin-left: 5px; animation-delay: 2.4s !important; }
@keyframes note-rise { 0% { opacity: 0; transform: translate(0, 4px) scale(.6) rotate(0); } 20% { opacity: 1; } 70% { opacity: .9; } 100% { opacity: 0; transform: translate(-30px, -16px) scale(1.1) rotate(-18deg); } }
@keyframes note-fade { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .music-btn[aria-pressed="true"] .note { animation-name: note-fade; } }
.music-btn[aria-pressed="true"] { color: var(--rubric); border: 2px solid var(--rubric); }
.music-btn[aria-pressed="true"] > svg:first-child { opacity: 1; }
#ytHolder { position: fixed; width: 1px; height: 1px; left: -9999px; top: 0; overflow: hidden; }
/* The three little niches take the gabled front of the Torhalle at Lorsch: a pointed pediment over square shoulders. */
.theme-btn, .lang, .music-btn { position: relative; isolation: isolate; overflow: hidden; width: 40px; height: 46px; border: 0; border-radius: 0; background: none; box-shadow: none; }
.music-btn { overflow: visible; }
.theme-btn:hover, .lang:hover, .music-btn:hover { border-color: transparent; }
.gable { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; overflow: visible; }
.gable .o { fill: var(--paper); stroke: var(--rule); stroke-width: 1.3; stroke-linejoin: miter; }
.gable .i { fill: none; stroke: var(--rule); stroke-width: 1; }
.theme-btn:hover .gable .o, .lang:hover .gable .o, .music-btn:hover .gable .o { stroke: var(--accent); }
.music-btn[aria-pressed="true"] .gable .o { stroke: var(--rubric); stroke-width: 2; }
.crumbs { margin-right: auto; }

/* Layout: an index, as at the back of a book. A slim navigation bar, the title with search and order filters,
   then one row per house; each row opens that house's full record. */
body { min-height: 100%; }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule); }
.nav-in { max-width: 1040px; margin: 0 auto; padding: 10px 24px; display: flex; gap: 10px; align-items: center; }
.nav .sp { flex: 1; }
.page { max-width: 1040px; margin: 0 auto; padding-inline: 24px; padding-block: 26px 56px; display: grid; gap: 18px; }
h1 { margin: 0; font: 400 clamp(32px, 5vw, 46px)/1.05 var(--title); }
.tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.search { position: relative; flex: 1 1 280px; max-width: 420px; }
.search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); font-size: 15px; }
.search input:focus-visible { outline: none; border-color: var(--accent); }
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.of { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: var(--panel); border-radius: 3px; padding: 3px 11px 3px 4px; font-size: 13.5px; cursor: var(--hand); }
.of[aria-pressed="false"] { opacity: .45; }
.of[aria-pressed="false"] .emblem { filter: grayscale(1); }
.sort { border: 1px solid var(--rule); background: var(--panel); border-radius: 4px; padding: 7px 8px; font-size: 13.5px; margin-left: auto; }
.count { font-size: 13.5px; color: var(--muted); }
.count b { color: var(--ink); }
.index { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.index a { display: grid; grid-template-columns: 54px minmax(0, 1.5fr) minmax(0, 1.6fr) 118px 92px; gap: 14px; align-items: center; padding: 11px 10px; border-bottom: 1px solid var(--rule); color: var(--ink); text-decoration: none; }
.index a:hover, .index a:focus-visible { background: var(--accent-soft); }
.index .name { font: 400 18px/1.2 var(--display); min-width: 0; }
.index .why { display: block; font: 400 12.5px var(--body); color: var(--accent); margin-top: 2px; }
.index .what { font-size: 14px; color: var(--muted); min-width: 0; }
.index .what b { color: var(--ink); font-weight: 500; }
.index .yrs { font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.index .n { font-size: 13px; color: var(--muted); text-align: right; }
.empty { padding: 26px 10px; color: var(--muted); }
@media (max-width: 760px) {
  .page { padding-inline: 16px; }
  .nav-in { padding: 8px 16px; }
  .index a { grid-template-columns: 46px minmax(0, 1fr) auto; gap: 4px 12px; }
  .index .what { grid-column: 2 / -1; }
  .index .n { display: none; }
  .sort { margin-left: 0; }
}
</style>

  if (!el || el.closest("script, style, .maplibregl-ctrl-attrib")) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = root.nodeType === 3 ? [root] : [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const host = n.parentElement;
    if (!host || host.closest("script, style, .maplibregl-ctrl-attrib")) continue;
    if (host.closest(SHEET_TEXT)) continue;
    const next = deText(n.nodeValue, n.nodeValue.length < 140);
    if (next !== n.nodeValue) n.nodeValue = next;
  }
  const els = root.nodeType === 1 ? [root, ...root.querySelectorAll("[title], [placeholder], [aria-label]")] : [];
  for (const e of els) for (const a of ["title", "placeholder", "aria-label"]) {
    const v = e.getAttribute?.(a);
    if (v) { const next = deText(v, true); if (next !== v) e.setAttribute(a, next); }
  }
}
function initLang(anchor) {
  // Blocks translated as a whole.
  if (LANG === "de") document.querySelectorAll("[data-t]").forEach(e => { if (DE[e.dataset.t] != null) e.innerHTML = DE[e.dataset.t]; });
  document.querySelectorAll("[lang='en']").forEach(e => { e.lang = LANG; });
  if (LANG === "de") {
    document.title = deText(document.title, true);
    translateDom(document.body);
    new MutationObserver(list => {
      for (const m of list) {
        if (m.type === "characterData") translateDom(m.target);
        else if (m.type === "attributes") translateDom(m.target);
        else m.addedNodes.forEach(n => translateDom(n));
      }
    }).observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["title", "placeholder", "aria-label"] });
    new MutationObserver(() => { const t = deText(document.title, true); if (t !== document.title) document.title = t; }).observe(document.querySelector("title"), { childList: true });
  }
  // The switch itself, placed beside the theme button.
  // One niche holding a reel of two capitals, D above E; it turns to the other letter, shuffling, when clicked.
  const box = document.createElement("button");
  box.type = "button"; box.className = "lang"; box.dataset.sheet = "";
  box.setAttribute("aria-label", "Sprache / Language");
  box.title = LANG === "de" ? "Switch to English" : "Auf Deutsch umschalten";
  box.innerHTML = '<span class="reel"><span>D</span><span>E</span></span>';
  const reel = box.firstChild, pos = l => l === "de" ? "0%" : "-50%";
  addGable(box);
  let from = null;
  try { from = sessionStorage.getItem("orders-map:langfrom"); sessionStorage.removeItem("orders-map:langfrom"); } catch {}
  if (from === "de" || from === "en") { if (from !== LANG) { reel.style.transition = "none"; reel.style.transform = `translateY(${pos(from)})`; void reel.offsetWidth; setTimeout(() => { reel.style.transition = ""; reel.style.transform = `translateY(${pos(LANG)})`; }, 250); } else reel.style.transform = `translateY(${pos(LANG)})`; }
  else reel.style.transform = `translateY(${pos(LANG)})`;
  box.onclick = () => {
    const next = LANG === "de" ? "en" : "de";
    try { localStorage.setItem(LANG_KEY, next); sessionStorage.setItem("orders-map:langfrom", LANG); } catch {}
    box.classList.add("shuffle"); reel.style.transform = `translateY(${pos(next)})`;
    setTimeout(() => location.reload(), 650);
  };
  anchor.insertAdjacentElement("beforebegin", box);
}

if (LANG === "de") for (const k of Object.keys(DATA.orders)) DATA.orders[k] = L(DATA.orders[k]);
const houses = DATA.houses;
const byId = Object.fromEntries(houses.map(h => [h.id, h]));
const personById = Object.fromEntries(DATA.persons.map(p => [p.id, p]));

// ---------- derived fields ----------
for (const h of houses) {
  const ps = h.periods.filter(p => p.start != null);
  h.start = ps.length ? Math.min(...ps.map(p => p.start)) : null;
  h.end = ps.length ? Math.max(...ps.map(p => p.end ?? p.start)) : null;
  h.endUnknown = h.periods.some(p => p.start != null && p.end == null);
  h.orders = [...new Set(h.periods.map(p => p.order))];
  h.loc = h.locations[0];
  h.label = h.external ? h.name : h.place;
}
const range = h => h.start == null ? "dates unknown" :
  `${h.periods.some(p => p.approx) ? "c. " : ""}${h.start}–${h.endUnknown ? "?" : h.end}`;
const orderAt = (h, y) => h.periods.find(p => p.start != null && y >= p.start && y <= (p.end ?? MAX_Y));

const ordersText = h => h.periods.map(p => DATA.orders[p.order] + (p.uncertain ? " (uncertain)" : "")).join(" → ");
const houseUrl = id => "house.html#" + id;
function timelineSvg(h, year = null) {
  const W = 360, x = y => 4 + (y - MIN_Y) / (MAX_Y - MIN_Y) * (W - 8);
  const rows = h.periods.filter(p => p.start != null);
  const bars = rows.map((p, i) => {
    const e = p.end ?? p.start + 10, y0 = 6 + i * 14;
    const fade = p.approx ? `<rect x="${x(p.start) - 10}" y="${y0}" width="10" height="9" fill="${oc(p.order)}" opacity=".3"/>` : "";
    return `${fade}<rect x="${x(p.start)}" y="${y0}" width="${Math.max(2, x(e) - x(p.start))}" height="9" rx="1.5" fill="${oc(p.order)}" ${p.uncertain ? 'fill-opacity=".45" stroke="' + oc(p.order) + '" stroke-dasharray="3 2"' : ""}/>`;
  }).join("");
  const ticks = [1200, 1300, 1400, 1500, 1600, 1700, 1800].map(y => `<line class="axis" x1="${x(y)}" x2="${x(y)}" y1="40" y2="44"/><text x="${x(y)}" y="55" text-anchor="middle">${y}</text>`).join("");
  const now = year != null ? `<line class="now" x1="${x(year)}" x2="${x(year)}" y1="0" y2="44"/>` : "";
  return `<svg class="timeline" viewBox="0 0 ${W} 58" role="img" aria-label="Order periods on a time axis"><line class="axis" x1="4" x2="${W - 4}" y1="42" y2="42"/>${ticks}${bars}${now}</svg>`;
}

// Order emblems, drawn after each order's own heraldry: the Hospitallers' white eight-pointed cross on black,
// the Templars' red cross pattée on white, the Teutonic Order's black cross on white with a gold rim, and the
// Carmelites' Mount Carmel crowned by a cross. Heraldic colours are fixed, so an emblem reads the same in both themes.
const EMBLEM = {
  hosp: { field: "#22272c", rim: "#c9d0d6", ink: "#ffffff", name: "white eight-pointed cross on black" },
  temp: { field: "#fbfaf6", rim: "#b3261e", ink: "#b3261e", name: "red cross pattée on white" },
  teut: { field: "#fbfaf6", rim: "#b8901c", ink: "#1b1b1b", name: "black cross on white, gold rim" },
  carm: { field: "#f6efe3", rim: "#6b4226", ink: "#6b4226", name: "Mount Carmel with a cross" },
};
const quarter = d => [0, 90, 180, 270].map(a => `<path d="${d}" transform="rotate(${a} 12 12)"/>`).join("");
const star = (cx, cy, R, r) => "M" + Array.from({ length: 10 }, (_, i) => {
  const a = -Math.PI / 2 + i * Math.PI / 5, d = i % 2 ? r : R;
  return `${(cx + d * Math.cos(a)).toFixed(2)} ${(cy + d * Math.sin(a)).toFixed(2)}`;
}).join("L") + "Z";
const EMBLEM_INK = {
  hosp: quarter("M12 12 8.2 3.5 12 5.7 15.8 3.5Z"),               // each arm: two points with a V notch
  temp: quarter("M10.9 12 9.9 7.4 8.1 3.5H15.9L14.1 7.4 13.1 12Z"),  // arms flaring towards the rim
  teut: quarter("M10.2 12V5.7L9 3.5H15L13.8 5.7V12Z"),               // straight arms, short flare
  carm: `<path d="M4.4 18.4 12 8.6 19.6 18.4Z"/><path d="M11.3 2.9h1.4v1.7h1.6V6h-1.6v2.6h-1.4V6H9.7V4.6h1.6Z"/>`
    + `<path d="${star(12, 14.6, 2.3, .95)}" fill="#f6efe3"/>`,
};
function emblem(o, size = 22, uncertain = false) {
  const e = EMBLEM[o];
  return `<svg class="emblem${uncertain ? " unc" : ""}" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">`
    + `<circle cx="12" cy="12" r="11" fill="${e.field}" stroke="${e.rim}" stroke-width="1.6"/><g fill="${e.ink}">${EMBLEM_INK[o]}</g></svg>`;
}

// Light / dark theme. The page follows the system setting until the reader picks one; the choice is kept in
// this browser. Setting data-theme is all it takes: the colour tokens, the map and the emblems follow it.
const THEME_KEY = "orders-map:theme";
try { const t = localStorage.getItem(THEME_KEY); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
const currentTheme = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
// The gabled frame shared by the corner buttons (candle, language, music), after the Torhalle at Lorsch.
function addGable(btn) {
  btn.insertAdjacentHTML("beforeend", '<svg class="gable" viewBox="0 0 40 46" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="gRecess" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a08" stop-opacity=".42"/><stop offset=".55" stop-color="#2a1a08" stop-opacity=".12"/><stop offset="1" stop-color="#2a1a08" stop-opacity=".02"/></linearGradient><linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a1a08" stop-opacity=".3"/><stop offset=".22" stop-color="#2a1a08" stop-opacity="0"/><stop offset=".85" stop-color="#2a1a08" stop-opacity="0"/><stop offset="1" stop-color="#2a1a08" stop-opacity=".16"/></linearGradient></defs><polygon class="o" points="20,1 39,14 39,45 1,45 1,14"/><polygon class="i" points="20,6.500 35,16.800 35,41 5,41 5,16.800"/><polygon points="20,6.500 35,16.800 35,41 5,41 5,16.800" fill="url(#gRecess)"/><polygon points="20,6.500 35,16.800 35,41 5,41 5,16.800" fill="url(#gSide)"/><path d="M5.600 41h28.800" stroke="#f4ecd6" stroke-opacity=".55" stroke-width="1.2"/></svg>');
}
function initThemeToggle(btn) {
  // A candle in a small arched niche: burning while the page is light, snuffed (a thread of smoke) while it is dark.
  const stand = '<path d="M10 10.8V12.5" stroke="currentColor" stroke-width="1.1"/><rect x="7.3" y="12.3" width="5.4" height="8.2" rx=".8" fill="#f3ead5" stroke="currentColor" stroke-width="1.1"/>'
    + '<path d="M3.8 20.5h12.4c0 1.7-2.2 2.7-6.2 2.7s-6.2-1-6.2-2.7z" fill="var(--gold)" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>';
  btn.innerHTML = '<svg viewBox="0 0 20 24" aria-hidden="true"><path class="smoke" d="M10 10c-1.8-1.6 1.6-2.7 0-4.3S11 3.200 10.3 1.6" pathLength="1" stroke="var(--muted)" stroke-width="1.1" stroke-linecap="round" fill="none"/>'
    + '<path class="spark" d="M10 6.5V3.5M6.5 8l-2.4-1.6M13.5 8l2.4-1.6M7.3 11.5l-2.3 1.3M12.7 11.5l2.3 1.3" stroke="#f1c75a" stroke-width="1.2" stroke-linecap="round" fill="none"/>'
    + '<g class="flame"><path d="M10 1.5C12.6 4.6 13.7 6.5 13.7 8.3A3.7 3.7 0 0 1 6.3 8.3C6.3 6.5 7.4 4.6 10 1.5Z" fill="#e9a13a" stroke="#ad4a22" stroke-width="1"><animate attributeName="d" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" values="M10 1.5C12.6 4.6 13.7 6.5 13.7 8.3A3.7 3.7 0 0 1 6.3 8.3C6.3 6.5 7.4 4.6 10 1.5Z;M9.6 1.1C12.1 4.4 13.6 6.4 13.7 8.3A3.7 3.7 0 0 1 6.3 8.3C6.3 6.4 7.5 4.5 9.6 1.1Z;M10.2 1.8C12.7 4.7 13.7 6.5 13.7 8.3A3.7 3.7 0 0 1 6.3 8.3C6.3 6.6 7.3 4.8 10.2 1.8Z;M9.9 0.9C12.3 4.3 13.6 6.4 13.7 8.3A3.7 3.7 0 0 1 6.3 8.3C6.3 6.4 7.6 4.4 9.9 0.9Z;M10.5 1.3C12.7 4.5 13.7 6.4 13.7 8.3A3.7 3.7 0 0 1 6.3 8.3C6.3 6.4 7.7 4.6 10.5 1.3Z;M9.8 1.9C12.4 4.8 13.7 6.5 13.7 8.3A3.7 3.7 0 0 1 6.3 8.3C6.3 6.6 7.2 4.9 9.8 1.9Z;M9.6 1.1C12.1 4.4 13.6 6.4 13.7 8.3A3.7 3.7 0 0 1 6.3 8.3C6.3 6.4 7.5 4.5 9.6 1.1Z;M10.5 1.3C12.7 4.5 13.7 6.4 13.7 8.3A3.7 3.7 0 0 1 6.3 8.3C6.3 6.4 7.7 4.6 10.5 1.3Z;M10 1.5C12.6 4.6 13.7 6.5 13.7 8.3A3.7 3.7 0 0 1 6.3 8.3C6.3 6.5 7.4 4.6 10 1.5Z"/></path>'
    + '<path d="M10 5.3c1.1 1.5 1.6 2.4 1.6 3.3a1.6 1.6 0 0 1-3.2 0c0-.9.5-1.8 1.6-3.3z" fill="#f8e6a8" stroke="none"><animate attributeName="d" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" values="M10 5.3c1.1 1.5 1.6 2.4 1.6 3.3a1.6 1.6 0 0 1-3.2 0c0-.9.5-1.8 1.6-3.3z;M9.6 4.8c1.3 1.8 2 2.9 2 3.8a1.6 1.6 0 0 1-3.2 0c0-.9.3-2 1.2-3.8z;M10.4 5.8c.9 1.2 1.2 2 1.2 2.8a1.6 1.6 0 0 1-3.2 0c0-.8.7-1.6 2-2.8z;M10.2 4.6c1 1.9 1.4 3 1.4 4a1.6 1.6 0 0 1-3.2 0c0-1 .6-2.1 1.8-4z;M9.6 4.8c1.3 1.8 2 2.9 2 3.8a1.6 1.6 0 0 1-3.2 0c0-.9.3-2 1.2-3.8z;M10 5.3c1.1 1.5 1.6 2.4 1.6 3.3a1.6 1.6 0 0 1-3.2 0c0-.9.5-1.8 1.6-3.3z"/></path></g>' + stand + '</svg>';
  // The flame's shape is always moving (see the <animate> elements); it holds still for readers who ask for less motion.
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) btn.querySelector("svg").pauseAnimations?.();
  const paint = () => {
    const dark = currentTheme() === "dark";
    btn.classList.toggle("snuffed", dark);
    btn.title = dark ? "Light the candle: switch to the light theme" : "Snuff the candle: switch to the dark theme";
    btn.setAttribute("aria-label", btn.title);
  };
  btn.onclick = () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    // Lighting the candle plays once: a spark at the wick, then the flame catches and grows.
    btn.classList.remove("lighting");
    if (next === "light") { void btn.offsetWidth; btn.classList.add("lighting"); }
    try { localStorage.setItem(THEME_KEY, next); } catch {}
    paint();
  };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
  paint();
  addGable(btn);
  initLang(btn);
}

// ---------- spelling-tolerant search ----------
const fold = s => String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
  .replace(/ß/g, "ss").replace(/ae/g, "a").replace(/oe/g, "o").replace(/ue/g, "u")
  .replace(/[zß]/g, "s").replace(/ck|c|q/g, "k").replace(/th/g, "t").replace(/y/g, "i").replace(/(.)\1+/g, "$1");
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      best = Math.min(best, cur[j]);
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
function wordMatch(q, text) {
  const t = fold(text);
  if (t.includes(q)) return true;
  if (q.length < 5) return false;
  const tol = q.length >= 9 ? 2 : 1;
  return t.split(/[^a-z]+/).some(w => w.length >= 4 && (lev(q, w, tol) <= tol || (w.length > q.length && lev(q, w.slice(0, q.length), tol) <= tol)));
}
for (const h of houses) {
  h.index = [
    { why: null, text: h.label }, ...h.aliases.map(a => ({ why: "also written " + a, text: a })),
    { why: null, text: h.id },
    ...h.people.map(p => ({ why: "office holder: " + p.name, text: p.name })),
  ];
}
function searchHit(h, raw) {
  const words = fold(raw).split(/\s+/).filter(Boolean);
  if (!words.length) return { ok: true };
  for (const entry of h.index) if (words.every(w => wordMatch(w, entry.text))) return { ok: true, why: entry.why };
  return { ok: false };
}


const state = { q: "", orders: new Set(ORDER_KEYS), sort: "name" };
const mine = houses.filter(h => !h.external && h.status === "checked");   // the same houses the map shows
function renderFilters() {
  $("#filters").innerHTML = ORDER_KEYS.map(o => `<button class="of" data-o="${o}" aria-pressed="${state.orders.has(o)}">${emblem(o, 22)}${DATA.orders[o]}</button>`).join("");
}
const sorters = {
  name: (a, b) => a.label.localeCompare(b.label, "de") || (a.start ?? 0) - (b.start ?? 0),
  start: (a, b) => (a.start ?? 9999) - (b.start ?? 9999) || a.label.localeCompare(b.label, "de"),
  people: (a, b) => b.people.length - a.people.length || a.label.localeCompare(b.label, "de"),
};
function render() {
  const rows = mine.map(h => [h, searchHit(h, state.q)]).filter(([h, v]) => v.ok && h.orders.some(o => state.orders.has(o))).sort(([a], [b]) => sorters[state.sort](a, b));
  $("#count").innerHTML = `<b>${rows.length}</b> of ${mine.length} houses`;
  $("#index").innerHTML = rows.length ? rows.map(([h, v]) => `<li><a href="${houseUrl(h.id)}">
      <span class="dots">${h.periods.map(p => emblem(p.order, 24, p.uncertain)).join("")}</span>
      <span class="name">${esc(h.label)}${v.why ? `<span class="why">${esc(v.why)}</span>` : ""}</span>
      <span class="what"><b>${esc(h.periods.map(p => DATA.orders[p.order] + (p.uncertain ? " (?)" : "")).join(" → "))}</b> · ${esc(h.type)}${h.status === "excluded" ? ' · <span class="tag warn">excluded</span>' : ""}</span>
      <span class="yrs">${esc(range(h))}</span>
      <span class="n">${h.people.length ? h.people.length + " office holder" + (h.people.length === 1 ? "" : "s") : ""}</span></a></li>`).join("")
    : `<li class="empty">No house matches. Clear the search or switch an order back on.</li>`;
}
$("#q").oninput = e => { state.q = e.target.value; render(); };
$("#sort").onchange = e => { state.sort = e.target.value; render(); };
$("#filters").onclick = e => { const b = e.target.closest("[data-o]"); if (!b) return; const o = b.dataset.o;
  state.orders.has(o) && state.orders.size > 1 ? state.orders.delete(o) : state.orders.add(o); renderFilters(); render(); };
initThemeToggle($("#themeBtn"));
renderFilters(); render();
</script>
