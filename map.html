:"Muhde","aliases":[],"type":"double commandery","community":"Double","status":"unreviewed","excludedReason":null,"periods":[{"order":"hosp","uncertain":false,"row":41,"start":1319,"end":1561,"approx":false,"startKind":"mentioned","endKind":"ended","startWritten":"1319","endWritten":"1561","unsureDates":false}],"locations":[{"lat":53.205,"lon":7.418,"accurate":true,"note":null}],"diocese":"Münster","province":"Great Priory Germany","patron":"John Baptist","wikidata":"Q1478495","gsn":"854","founder":null,"history":"Around 1284, the house of the order in Muhde was founded on old property of the Werden monastery, which had been purchased by the Order of St. John. From here, ship connections were possible between the commandery Langholt and Bokelesch with the Jemgum house in Rheiderland. This economic advantage comes clear for the first time in the Groningen Vergleich of 1319. In 1408 the commandery received patronage over the Petkum parish church. In the years after 1470, the commander of Muhde, Aynardus Lheris, held the position of Frisian Commissioner. He must have been an outstanding personality, as this office was usually filled by the commanders of the religious houses in Groningerland or by the commander in Jemgum. Shortly before the Reformation, Muhde had the right of patronage to the church of Mitling in the Osnabrück diocese. Until shortly before the Reformation, religious priests also kept their personal property and disposed of it in their wills. In 1490, in addition to the priests and nuns, there were several lay brothers in Muhde. After 1500 there were no longer any working brothers in the commandery. From 1471 until the time of the Reformation, the commander and two other priests lived in Muhde. In the years after 1500 there were around six sisters in the Coming. In 1528, Count Enno II expropriated the Vorwerke in Halte and Petkumermönken as well as the lands near Coldemüntje and Mitling. The Silver and gold Kleinodien were stolen from the house of the order in Muhde as well. Since 1529, a count's Rentmeister monitored the convent, and the house had to pay a tax. The commandery had no commander in 1540; at the head was the lay brother Johann Abenlich. There were also two priests and five old sisters, for whom at least one mass was read every day. There were also ten servants and six maids. Although the convent of the Jemgum community fled to Muhde after the destruction, the religious house suffered from obsolescence. In 1556 Muhde's church and buildings were destroyed. On March 28, 1561, Commander Berendt von Hage waived all of his rights as Commander von Muhde in a document. In return for a payment of 100 thalers and an annual study aid of 30 thalers for his son, he handed over the house of the order to Countess Anna.","architecture":null,"remains":null,"images":[],"literature":{"author":"Sgonina, Marc","heading":"Muhde – Johanniter-Doppelkommende (Um 1284 bis 1561)","pages":"1066-1068"},"people":[{"name":"Aynardus","role":"commander","years":"1412-1423","raw":"Aynardus (1412-1423)","person":"P-031"},{"name":"Hero","role":"commander","years":"1442","raw":"Hero (1442)","person":"P-209"},{"name":"Aynardus Lheris","role":"commander","years":"1465-1471","raw":"Aynardus Lheris (1465-1471)","person":"P-032"},{"name":"Gosyng/Gotze/Goesman","role":"commander","years":"1486-1504, 1507-1525","raw":"Gosyng/Gotze/Goesman, Chaplain (1486-1504), Wylteken, Wylko (1507-1525)","person":"P-143"},{"name":"Eylert","role":"commander","years":"1529-1532","raw":"Eylert (1529-1532)","person":"P-095"},{"name":"Johannes","role":"commander","years":"1540","raw":"Johannes (1540)","person":"P-262"},{"name":"Weber","role":"commander","years":"1548","raw":"Weber (1548)","person":"P-361"},{"name":"Berendt von Hage","role":"commander","years":"1548-1562","raw":"Berendt von Hage (1548-1562)","person":"P-039"}],"raw":{"id":"Hosp_DE_","name":"Muhde / Hospitallers doublecommenda","order":"Hospitallers","lat":" 53.205","lon":7418,"founded":null,"end":"1561","municipality":null,"parish":null,"foundedClean":null,"endClean":"1561","firstMentioned":"1319","lastMentioned":null,"firstClean":"1319","lastClean":null,"heading":"Um 1284 bis 1561","mother":null,"people":"Commanders: Aynardus (1412-1423); Hero (1442); Aynardus Lheris (1465-1471); Gosyng/Gotze/Goesman, Chaplain (1486-1504), Wylteken, Wylko (1507-1525); Eylert (1529-1532); Johannes (1540); Weber (1548); Berendt von Hage (1548-1562)."}},{"id":"H-039","row":42,"merged":[],"place":"Oldenburg","aliases":[],"type":"commandery","community":"Male","status":"unreviewed","excludedReason":null,"periods":[{"order":"hosp","uncertain":false,"row":42,"start":null,"end":1531,"approx":false,"startKind":null,"endKind":"ended","startWritten":null,"endWritten":"1531","unsureDates":false}],"locations":[{"lat":53.136,"lon":8.214,"accurate":false,"note":"Ortsangabe: vermuteter Standort der Johanniterkapelle"}],"diocese":"Bremen","province":"Great Priory Germany","patron":"John Baptist","wikidata":"Q28980074","gsn":"859","founder":"Count Christian von Oldenburg","history":"The Johanniter branch in Oldenburg, which only existed in the form of a chapel, was founded around 1378 or according to other information in 1387 as a result of a vow made by the as a result of a vow by Count Christian von Oldenburg after his destruction of the church and other properties of the commandery Wyckleesen. It was subordinate to the commandery in Lage. The Hospitallers chapel \"vor der Burg\" also served as the counts' chapel. The first two leaders were Hospitaller clergy. After the founder's death, the chapel was looked after by secular clergy, including Heinrich Wolters in the fifth generation, whose chronicle provides data on the history of the chapel's founding and the economic situation. Wolters later became a Hospitaller. After breaking away from the order, the assets of the chapel of the Hospitallers must have decreased. In 1461, Count Gerhard authorized Johann Tom Broke to collect gifts and alms for the St. John's Chapel within and outside the county. The year 1531 marked the end of the chapel as a spiritual institution, the sunte Johans capel vor der borch was, as it says in the \"Chronik van den groten daden\", enthilligt und in gemenen bruk gewent worden. At the same time, most of the other commanderies in the county of Oldenburg were confiscated.","architecture":null,"remains":null,"images":[],"literature":{"author":"Rößner, Regina","heading":"Oldenburg – Johanniter (1378/87 bis 1531)","pages":"1134-1135"},"people":[{"name":"Head","role":"office holder","years":"","raw":"Head (chaplain of the order)","person":"P-156"},{"name":"Johannes mines heren sone","role":"office holder","years":"around 1378","raw":"Johannes mines heren sone (around 1378)","person":"P-268"},{"name":"Friedrich Hovemann. Secular clergy: Johannes","role":"office holder","years":"","raw":"Friedrich Hovemann. Secular clergy: Johannes","person":"P-115"},{"name":"Johannes Nopernagel","role":"office holder","years":"","raw":"Johannes Nopernagel","person":"P-269"},{"name":"Heinrich Wolters (around 1432","role":"office holder","years":"","raw":"Heinrich Wolters (around 1432","person":"P-181"},{"name":"later accepted into the order)","role":"office holder","years":"","raw":"later accepted into the order)","person":"P-289"}],"raw":{"id":"Hosp_DE_","name":"Oldenburg / Hospitallers commenda","order":"Hospitallers","lat":53136,"lon":8214,"founded":null,"end":"1531","municipality":"Oldenburg","parish":null,"foundedClean":null,"endClean":"1531","firstMentioned":null,"lastMentioned":null,"firstClean":null,"lastClean":null,"heading":"1378/87 bis 1531","mother":null,"people":"Head (chaplain of the order): Johannes mines heren sone (around 1378); Friedrich Hovemann. Secular clergy: Johannes; Johannes Nopernagel; Heinrich Wolters (around 1432; later accepted into the order)"}},{"id":"H-040","row":43,"merged":[],"place":"Osnabrück","aliases":[],"type":"commandery","community":"Male","status":"unreviewed","excludedReason":null,"periods":[{"order":"teut","uncertain":false,"row":43,"start":null,"end":1809,"approx":false,"startKind":null,"endKind":"ended","startWritten":null,"endWritten":"June 10th 1809","unsureDates":false}],"locations":[{"lat":52.268,"lon":8.048,"accurate":true,"note":null}],"diocese":"Osnabrück","province":"Bailiwick Westphalia","patron":"St. Marien, St. Georg","wikidata":"Q28980171","gsn":"864","founder":"Teutonic Order Commandery Münster","history":"In 1305 the commandery in Münster was given three houses and pensions from four more by the citizens of Osnabrück Hermann Dwerg, whose brother Gerhard was a knight of the order. A fourth house was given by Lambert Glode, who joined the order at the same time. The four neighboring properties in the southwest of the new town formed the basis for the site of the later coming. Further donations from Hermann Dwerg and purchases from the commandery in Münster expanded the properties in Osnabrück in the following decades. There were signs of an established future beginning in 1352, when sales and donations were still directed at Münster, but a house in Osnabrück was already mentioned. In 1378 it was independent, when it purchased three other neighboring properties, a priest and a brother from families from Osnabrück were named. The area of ​​the commandery stretched from today's Kommenderiestrasse to the city wall at the Schlagpforte and some individual houses on the surrounding streets. Of the houses of the Bailiwick Westphalia, the commandery Osnabrück was not only the youngest, it also remained the smallest and economically weakest. Only two or three monks appear in the documents, the minimum number of twelve brothers under one commander seems to have never been reached, as in other Westphalian commanderies. The commandery had its most important time under Sweder von Diepenbrock, the previous landcommander of the Bailiwick Westphalia, who also secured its continued existence with economic measures. The commander had a seat and a vote among the knighthood in the state parliaments, but was also called upon by the bishop to pay state taxes. During the Reformation, Commander Wilhelm von der Recke married, but initially refused to resign from his position. In the second half of the 16th century, some of the commanders resided on the estate Nette, which was not part of the commandery. After Gerd von Senden's death, management initially fell to the landcommander and appointed provisionals. From 1628 onwards, an independent commander was appointed again under Bishop Franz Wilhelm von Wartenberg. The church burned down during the Swedish occupation. The request made to the council in 1658 to be allowed to use the abandoned Jesuit church for worship as a replacement was rejected by the council with reference to the standard year. A reconstruction was delayed, so the Deutschmaster Franz Ludwig wanted to leave the commanery unoccupied in 1726 in order to finance a new building with the income. He put back 700 Reichstallers, but they were not enough. The new building was only built under Bishop Clemens August from 1732 onwards. But since 1727, the commanders no longer resided in the commandery Osnabrück, which was finally transferred to the Westphalian landcommander in 1763. It was dissolved on June 10, 1809 when it was confiscated by the Crown of Westphalia.","architecture":null,"remains":null,"images":[],"literature":{"author":"Igel, Karsten","heading":"Osnabrück – Deutscher Orden (Ca. 1378 bis 1805)","pages":"1199-1202"},"people":[{"name":"Hermann van Brantlecht","role":"commander","years":"1393","raw":"Hermann van Brantlecht (1393)","person":"P-197"},{"name":"Arnd","role":"commander","years":"1423","raw":"Arnd (1423)","person":"P-018"},{"name":"Reynold von Asbeke","role":"commander","years":"1435-1447","raw":"Reynold von Asbeke (1435-1447)","person":"P-338"},{"name":"Thomas Hagenbeke","role":"commander","years":"1452-1456","raw":"Thomas Hagenbeke (1452-1456)","person":"P-353 "lat":53.542,"lon":8.287,"accurate":true,"note":null}],"diocese":null,"province":null,"patron":"probably John Baptist","wikidata":"Q28980566","gsn":"884","founder":null,"history":"The Hospitallerhouse in Roddens, which is first mentioned in the Stader Kopiar in 1420, was not yet listed among the order's possessions in Frisia in the Gröninger Vergleich of 1319. The house in Roddens was a relocation or new construction of the orders estate in Langewische after the collapse of the Hayenschloote around 1318, at the latest after the breakthrough of the Heete between the Jade and Weser in 1334. After the Reformation, the commandery was forcibly secularized around 1525 by Count Anton I. of Oldenburg. Lawsuits brought by the Order before the Reichskammergericht against the confiscation of the houses of ther order in Roddens, Strückhausen, Bredehorn and Inte led to an agreement in 1588. For compensation of 5200 Reichsthaler the order renounced its ownership rights .The Hospitaller farm Stick in the parish of Tossens most likely belonged to Rodden's commandery.","architecture":"The former monastery was probably a Gulfhaus; it stood on a mound approximately 30 metres in diameter","remains":null,"images":[],"literature":{"author":"Koolman, Egbert und Nistal, Matthias","heading":"Roddens – Johanniter (Nach 1334 bis ca. 1525)","pages":"1327-1329"},"people":[{"name":"Meynard","role":"commander","years":"1424","raw":"Meynard (1424)","person":"P-312"}],"raw":{"id":"Hosp_DE_","name":"Roddens / Hospitallers commenda","order":"Hospitallers","lat":53542,"lon":8287,"founded":null,"end":"1525","municipality":null,"parish":null,"foundedClean":null,"endClean":"1525","firstMentioned":"1420","lastMentioned":null,"firstClean":"1420","lastClean":null,"heading":"Nach 1334 bis ca. 1525","mother":null,"people":"Commander: Meynard (1424)"}},{"id":"H-042","row":45,"merged":[],"place":"Strückhausen","aliases":["Struckhusen"],"type":"commandery","community":"Male","status":"unreviewed","excludedReason":null,"periods":[{"order":"hosp","uncertain":false,"row":45,"start":null,"end":1535,"approx":true,"startKind":null,"endKind":"ended","startWritten":null,"endWritten":"1535 – 1530","unsureDates":false}],"locations":[{"lat":53.316,"lon":8.387,"accurate":true,"note":null}],"diocese":"Bremen","province":"Great Priory Germany","patron":"Mary; John Evangelist","wikidata":"Q28977830","gsn":"3586","founder":"Hospitaller Hylderyck","history":"The commandery Struckhusen was probably only built at the beginning of the 15th century on the site of the old parish church, which had been destroyed by storm floods about a hundred years earlier. The founder was the landlord, hospitaller Hylderyck, whose declaration of intent regarding this process, made shortly before his death, was attested in a document in 1423. He had transferred the branch to the Order of St. John as their own. In 1521 the property of the commandery Strückhausen was finalized in an exchange agreement between the last commander Hinrich Marschmann (also Heinrich Marßmann) and Count Johann V of Oldenburg. After the secularization (around 1530-35) under Count Anton I of Oldenburg, the estate came as an appanage to Count Georg von Oldenburg (d. 1551), whose descendants who were unable to succeed took over the property on a hereditary lease for five generations until 1688. After further feudal changes, the estate was awarded by the Danish crown to Baron Konrad Alexander von Vrintz in 1736 and allodized in 1764. Under this owner, the former commandery was given the name (Gut) Treuenfeld. Later it was owned by a Countess von Schmettau and in 1795 it was given the name (Gut) Harlinghausen, which is still in use today.","architecture":null,"remains":"none","images":[],"literature":{"author":"Koolman, Egbert und Nistal, Matthias","heading":"Strückhausen – Johanniter (Vermutlich Anfang 15 Jh. bis ca. 1530)","pages":"1402-1403"},"people":[{"name":"Heinrich Marßmann/Hinrich Marschmann","role":"commander","years":"1521","raw":"Heinrich Marßmann/Hinrich Marschmann (1521)","person":"P-162"}],"raw":{"id":"Hosp_DE_","name":"Strückhausen / Hospitallers commenda","order":"Hospitallers","lat":53316,"lon":8387,"founded":null,"end":"1535 – 1530","municipality":null,"parish":null,"foundedClean":null,"endClean":"c. 1530–1535","firstMentioned":null,"lastMentioned":null,"firstClean":null,"lastClean":null,"heading":"Vermutlich Anfang 15 Jh. bis ca. 1530","mother":null,"people":"Commander: Heinrich Marßmann/Hinrich Marschmann (1521)"}},{"id":"H-043","row":46,"merged":[47],"place":"Süpplingburg","aliases":["Süpplingenburg"],"type":"commandery","community":"Male","status":"unreviewed","excludedReason":null,"periods":[{"order":"temp","uncertain":false,"row":47,"start":1170,"end":1312,"approx":false,"startKind":"founded","endKind":"ended","startWritten":"1170","endWritten":"1312","unsureDates":false},{"order":"hosp","uncertain":false,"row":46,"start":1312,"end":1820,"approx":false,"startKind":"founded","endKind":"ended","startWritten":"1312","endWritten":"1820","unsureDates":false}],"locations":[{"lat":52.25,"lon":10.904,"accurate":true,"note":null}],"diocese":"Halberstadt","province":"Lowergermany","patron":"Mary; John","wikidata":"Q28976599","gsn":"164","founder":null,"history":"Emperor Lothar III. founded a collegiate church around 1130. Süpplingenburg is only attested as a commandery of the Templars in 1245. Heinrich der Löwe probably initiated the handover of the Süpplingenburg collegiate church to the Templars after his return from the Holy Land in 1173. Süpplingenburg is therefore considered the oldest Templar commandery in the German north. In 1301 the Templars received jurisdiction over the village and field of Süpplingenburg from Duke Albrecht II (1279-1318). The commandery court later passed to the Hospitallers and was in office until 1807. The relatively close relationships with the Silesian Templar community Klein Oels led to Süpplingenburg also becoming effective in the area of ​​the eastern settlement. With the abolition of the Templars by Pope Clement V in 1312, the Commandery passed nominally to the Hospitallers. The last Templar Commander in Süpplingenburg, Duke Otto of Braunschweig (since 1304), retained, with the consent of the Johanniter Commander in Braunschweig, Gebhard von Bortfeld, the right to use the Templar Court on the Bohlweg in Braunschweig as well as the income from the castle itself for life. After Otto's death (after 1345), Duke Magnus I (1344-1369) claimed power over the future. During Otto's lifetime, Magnus had not only pledged Bahrdorf but also Süpplingenburg to the Dukes Otto (1277-1330) and Wilhelm von Lüneburg (1330-1369). In 1357, the Johanniters in Braunschweig redeemed Süpplingenburg from Duke Wilhelm and thus came into complete possession of the commandery, which now officially belonged to the bailiwick Brandenburg. At the same time, they committed themselves to continuing to support the Duke with the castle. Since then, the Johannishof in Braunschweig has been seen as an accessory of the commandery. The office of commander was now usually taken over by a representative of the Braunschweig knighthood. On October 10, 1542, the then commander of Süpplingenburg, Matthias Dörgke (Diricke), committed himself to introducing the Reformation in Königslutter before the visitation commission of the Schmalkaldic League. After his return in 1547, Duke Heinrich der Jüngere initially recatholicized his territory on the basis of the Augsburg interim. In the period that followed, there were apparently repeated tensions between the Johanniters, especially the Johannitermeister in Sonnenburg (Stonsk/Neumark), and the Duke because of Süpplingenburg. In 1577 Duke Julius finally confiscated the commandery and took it under sovereign administration. Duke Heinrich Julius restored it in 1591 and reached a settlement with the Johannitermeister about the appointment of the commandery, which was to be awarded alternately to his own candidates in the future. From 1690 onwards, the Dukes of Braunschweig held the title of commander. With the death of Commander Duke August in 1820, Süpplingenburg fell to the ducal chamber and has been administered as a domain ever since. It existed until 1965.","architecture":"The area of the former commandery, approximately 70 metres long and almost as wide, was surrounded by a moat and accessed via a stone drawbridge leading from the main gate, which opened onto the western part of the island-like castle complex to the north. On either side of the Jete stood the residential building with its brewery – rebuilt in 1615 along with the gate, presumably following a fire, and renovated again in 1697 – and the administrative building. The courthouse adjoined the collegiate church directly. A series of outbuildings and stables occupied the rear section, whilst gardens and further farm buildings had been laid out and established in the farmyard situated in front of the gate. Owing to its unique location in what was then the marshy Schunter lowlands, the castle had been regarded as virtually impregnable and withstood a series of sieges during the Thirty Years’ War. The collegiate church, later the Order’s church of St John, was built in two phases. It was initially erected in the 1130s as a flat-roofed cruciform basilica and was presumably rebuilt as a vaulted basilica following a fire in the mid-13th century (c. 1250). The vault ribs of the southern transept form the coat of arms of the Kingdom of Jerusalem (the Cross of Jerusalem). With the west wing, the construction of which had already been abandoned in the Middle Ages, the collegiate church reached a total length of around 50 metres.","remains":"Today, only the nave and the eastern sections – comprising the main chancel, beneath which the remains of a three-aisled crypt can still be found, and the side apses – have survived.","images":["https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/Spuren_der_Templer_in_Deutschland.jpg"] r":"teut","uncertain":false,"row":51,"start":null,"end":1809,"approx":false,"startKind":null,"endKind":"ended","startWritten":null,"endWritten":"1809","unsureDates":false}],"locations":[{"lat":51.974,"lon":10.49,"accurate":true,"note":null}],"diocese":"Hildesheim","province":"Bailiwick Saxony","patron":null,"wikidata":"Q28977834","gsn":"3589","founder":null,"history":"The house of the Teutonic Order in Goslar gained the first property in Weddingen in 1287 through a donation from the Hildesheim ministerial Heinrich von Birkenstein, who gave the order not only the land but also the church and the right of patronage. In the 13th century and the first half of the 14th century, the order managed to expand its possessions here and in the surrounding towns, and in the course of the second half of the century, the headquarters were moved from Goslar to Weddingen in what was apparently a lengthy process. Little is known about the further medieval history of the religious house, which was apparently always very small, in 1410-1411 two fratres (one of them a priest) and in 1451 a knight brother and a priest brother are attested, little is known. Given the current state of research, it remains uncertain to what extent knights were still present in Weddingen for a long time after 1500. Although through the 17th and 18th centuries commanders were attested, the commandery was mostly rented out. In 1809 the commandery was sold by the Westphalian government to the Jew Irac Jakobson, who had to cede it to the government because of the ban on Jewish property in the Kingdom of Hanover, which converted it into a state domain.","architecture":"A square-shaped farmstead surrounded by a moat, featuring an oak half-timbered structure built on broken sandstone with a richly decorated bay window","remains":"The east wing has been preserved; the south wing is only partially preserved","images":[],"literature":{"author":"Ohainski, Uwe","heading":"WEDDINGEN – Deutscher Orden (Zweite Hälfte 14. J const fold = s => String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
  .replace(/ß/g, "ss").replace(/ae/g, "a").replace(/oe/g, "o").replace(/ue/g, "u")

function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      best = Math.min(best, cur[j]);
    }

    prev = cur;

  return t.split(/[^a-z]+/).some(w => w.length >= 4 && (lev(q, w, tol) <= tol || (w.length > q.length && lev(q, w.slice(0, q.length), tol) <= tol)));
}

const types = [...new Set(houses.filter(h => !h.external).map(h => h.type))];
const state = { orders: new Set(ORDER_KEYS), types: new Set(types), q: "", useYear: false, year: 1300,
  links: false, accurate: false, excluded: false, sel: null };
function visible(h) {
  if (!h.loc) return { ok: false };                       // a mother house named in the sheet without a row: no place to draw
  if (h.status === "excluded" && !state.excluded) return { ok: false };
  if (!h.orders.some(o => state.orders.has(o))) return { ok: false };
  if (!state.types.has(h.type) && !h.external) return { ok: false };
  if (state.accurate && !h.loc.accurate) return { ok: false };
  if (state.useYear && !h.external) {
    const p = orderAt(h, state.year);
    if (!p || !state.orders.has(p.order)) return { ok: false };
  }
  const s = searchHit(h, state.q);
  return s;
}

// ---------- map ----------
// The basemap is the Cairo Interactive Map's own (mamluk-map/src/shared/basemap.js):
// OpenFreeMap's "liberty" vector style, with the modern clutter switched off, a night
// palette in dark mode, and an Esri imagery toggle. Where the tile host cannot be
// reached (some sandboxed viewers block it), an outline map drawn from the embedded
// coastline, state and river geometry takes its place.
const BASEMAP_STYLE = "https://tiles.openfreemap.org/styles/liberty";
const ESRI_TILES = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
const SATELLITE = "esri-satellite";
const CLUTTER_SOURCE_LAYERS = new Set(["poi", "aeroway", "building"]);
const CLUTTER_IDS = /^(poi_|airport|landuse_(hospital|school|pitch|track)|aeroway|road_shield|highway-shield)/;
const NIGHT = { land: "#1c1917", residential: "#211e1b", water: "#16202c", waterLabel: "#5a7f9c", green: "#182619",
  cemetery: "#1d2a20", building: "#262626", casing: "#121212", roadMinor: "#2a2a2a", road: "#333333", roadMajor: "#3d3a34",
  rail: "#2b2b2b", boundary: "#4a4a4a", label: "#9aa0a6", labelHalo: "#101010", roadLabel: "#c8a96e" };
const COLOR_PROP = { background: "background-color", fill: "fill-color", line: "line-color", "fill-extrusion": "fill-extrusion-color" };
// The day palette quietens the vendor's colours the same way: pale land and water, white roads, soft
// yellow motorways, so the order emblems are the strongest marks on the map.
const DAY = { land: "#ebe4d2", residential: "#e5ddc9", water: "#b7cbcc", waterLabel: "#4f7078", green: "#d6dab9",
  cemetery: "#d3d8b9", building: "#ded5c0", casing: "#d6ccb6", roadMinor: "#fbf7ec", road: "#fbf7ec", roadMajor: "#ecd9a4",
  rail: "#c9bea8", boundary: "#a99c84", label: "#4a4034", labelHalo: "#f6f1e4", roadLabel: "#7d705c" };
function paletteColor(layer, P) {
  const id = layer.id;
  if (layer.type === "background") return P.land;
  if (/water/.test(id)) return P.water;
  if (/park|wood|grass|wetland/.test(id)) return P.green;
  if (/cemetery/.test(id)) return P.cemetery;
  if (/residential|natural_earth|landcover_(sand|ice)/.test(id)) return P.residential;
  if (/building/.test(id)) return P.building;
  if (/casing/.test(id)) return P.casing;
  if (/rail/.test(id)) return P.rail;
  if (/boundary/.test(id)) return P.boundary;
  if (/motorway|trunk|primary/.test(id)) return P.roadMajor;
  if (/minor|service|track|path|pedestrian/.test(id)) return P.roadMinor;
  if (/road|highway|street|link|tunnel|bridge/.test(id)) return P.road;
  return null;
}
const labelColor = (id, P) => /highway.name|highway.shield|road_shield/.test(id) ? P.roadLabel : /water/.test(id) ? P.waterLabel : P.label;
const hiddenIds = new Set();
const isBasemapLayer = layer => layer.type === "background" || (!!layer.source && map.getSource(layer.source)?.type === "vector");
function curateBasemap() {
  for (const layer of map.getStyle().layers) {
    if (layer.id === SATELLITE) continue;
    const vendor3d = layer.type === "fill-extrusion" && isBasemapLayer(layer);
    const relief = layer.type === "raster";      // the vendor's shaded relief, shown when zoomed far out
    if (!vendor3d && !relief && !CLUTTER_SOURCE_LAYERS.has(layer["source-layer"]) && !CLUTTER_IDS.test(layer.id)) continue;
    map.setLayoutProperty(layer.id, "visibility", "none");
    hiddenIds.add(layer.id);
  }
}
function applyBasemapTheme(night) {
  const P = night ? NIGHT : DAY;
  for (const layer of map.getStyle().layers) {
    if (layer.id === HILLSHADE) { for (const [k, v] of Object.entries(reliefPaint(night))) map.setPaintProperty(HILLSHADE, k, v); continue; }

  const opts = [...document.querySelectorAll("#results button")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!opts.length) return;
    resultIdx = (resultIdx + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length; renderResults(); }
  else if (e.key === "Enter" && opts.length) { e.preventDefault(); select(opts[Math.max(0, resultIdx)].dataset.id); $("#results").hidden = true; }
  else if (e.key === "Escape") { $("#q").value = state.q = ""; render(); renderResults(); }
};
$("#results").onmousedown = e => { const b = e.target.closest("[data-id]"); if (b) { e.preventDefault(); select(b.dataset.id); $("#results").hidden = true; } };
document.querySelectorAll("[data-try]").forEach(b => b.onmousedown = e => { e.preventDefault(); $("#q").value = state.q = b.dataset.try; resultIdx = -1; render(); renderResults(); });
$("#useYear").onchange = e => { state.useYear = e.target.checked; if (!state.useYear && playT) clearInterval(playT), playT = null; setYearLabel(); render(); };
// One way to set the year, shared by the slider, the typed year and the − / + buttons.
function setYear(y) {
  if (playT) clearInterval(playT), playT = null;
  state.year = Math.min(MAX_Y, Math.max(MIN_Y, Math.round(y)));
  state.useYear = $("#useYear").checked = true;
  $("#year").value = state.year;
  setYearLabel(); render();
}
$("#year").oninput = e => setYear(+e.target.value);
const stepYear = (dir, e) => setYear((state.useYear ? state.year : dir > 0 ? MIN_Y - 1 : MAX_Y + 1) + dir * (e.shiftKey ? 10 : 1));
$("#yearMinus").onclick = e => stepYear(-1, e);
$("#yearPlus").onclick = e => stepYear(1, e);
const yearInput = $("#yearInput");
function commitYear() {
  const v = yearInput.value.trim();
  if (/^\d{3,4}$/.test(v)) setYear(+v);
  else setYearLabel();                     // not a year: put back what was there
}
yearInput.onfocus = () => { if (playT) stopPlay(); yearInput.select(); };
yearInput.oninput = () => { yearInput.value = yearInput.value.replace(/\D/g, ""); if (yearInput.value.length === 4) commitYear(); };
yearInput.onchange = commitYear;
yearInput.onkeydown = e => {
  if (e.key === "Enter") { commitYear(); yearInput.blur(); }
  else if (e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); stepYear(e.key === "ArrowUp" ? 1 : -1, e); }
  else if (e.key === "Escape") { e.stopPropagation(); setYearLabel(); yearInput.blur(); }
};
$("#onlyAccurate").onchange = e => { state.accurate = e.target.checked; render(); };
$("#showExcluded").onchange = e => { state.excluded = e.target.checked; render(); };
$("#list").onclick = e => { const li = e.target.closest("[data-id]"); if (li) select(li.dataset.id); };
$("#list").onkeydown = e => { if (e.key === "Enter") { const li = e.target.closest("[data-id]"); if (li) select(li.dataset.id); } };
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.sel) select(null); });
// Any click outside the open card closes it: the filters, the time bar, the search box, the list header and so
// on. Left alone are clicks that open a house (markers, list rows, search results), clicks on the map itself
// (the map's own handler closes the card there, but not after a drag), and zooming or switching to satellite.
const KEEPS_CARD = ".maplibregl-popup, .hmark, .cluster, .item, #results, .maplibregl-canvas, .maplibregl-ctrl-zoom-in, .maplibregl-ctrl-zoom-out, .maplibregl-ctrl-attrib, .bm-seg, .theme-btn";
document.addEventListener("click", e => {
  if (!state.sel && !card.p?.isOpen()) return;
  if (e.target.closest?.(KEEPS_CARD)) return;
  select(null);
});
$("#toggleAid").onclick = () => { const a = $("#aid"); a.classList.toggle("collapsed"); $("#toggleAid").textContent = a.classList.contains("collapsed") ? "Show filters" : "Hide filters"; setTimeout(() => map && map.resize(), 50); };
function stopPlay() { clearInterval(playT); playT = null; setYearLabel(); render(); }
$("#play").onclick = () => {
  if (playT) return stopPlay();
  // A first press, or a press at the end, tells the story from the beginning.
  if (!state.useYear || state.year >= MAX_Y) state.year = MIN_Y;
  state.useYear = $("#useYear").checked = true;
  $("#year").value = state.year;
  const step = matchMedia("(prefers-reduced-motion: reduce)").matches ? 25 : 2;
  playT = setInterval(() => {
    state.year = Math.min(MAX_Y, state.year + step); $("#year").value = state.year;
    if (state.year >= MAX_Y) return stopPlay();
    setYearLabel(); render();
  }, 90);
  setYearLabel(); render();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

initThemeToggle($("#themeBtn"));
renderOrders(); renderTypes(); renderKey(); setYearLabel(); render();
if ($(".mapwrap").clientWidth - insetLeft() < 880) $("#keyBox").open = false;
const LIST_KEY = "orders-map:list-open";
try { $("#listBox").open = localStorage.getItem(LIST_KEY) === "1"; } catch {}
$("#listBox").addEventListener("toggle", () => { try { localStorage.setItem(LIST_KEY, $("#listBox").open ? "1" : "0"); } catch {} });
startMap();
</script>
</body>
