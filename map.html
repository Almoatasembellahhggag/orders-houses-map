<style>
/* Layout: full-height atlas — finding aid on the left, the map beside it; a small card floats at the clicked house and links to its full record page. */
/* After the Lorsch Gospels (Codex Aureus of Lorsch, c. 810). The colours are measured from its pages: the vellum,
   the brown-gold of the letters, the minium orange and the dark blue of the frames. The entry page is built on
   the plan of its "Incipit argumentum" page: two columns between painted pillars. The type is Cardo, a face made for medievalists
   and classicists; controls and figures stay in a plain sans. */
:root {
  --paper: #e9dec4; --panel: #f3ead5; --ink: #2a2018; --muted: #6c5d48; --rule: #cdbd9b;
  --sea: #c5d1cd; --land: #e6dfcc; --land-edge: #b9ae95; --region: #f4eddb; --region-edge: #8a7c60; --river: #9fb6b8;
  --accent: #3c3a63; --accent-soft: #dfd8cc; --rubric: #ad4a22; --gold: #765622; --purple: #33304f; --on-purple: #efe3c4;
  --bad: #ad4a22; --bad-soft: #f2dccb; --good-soft: #dfe4c9;
  --o-hosp: #2b2723; --o-temp: #a3271b; --o-teut: #a37a12; --o-carm: #6b4226;
  --display: "Cardo", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --title: var(--display);
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: var(--body);
  --shadow: 0 1px 2px rgba(60, 45, 25, .10), 0 6px 18px rgba(60, 45, 25, .12);
  --ctrl-filter: none;
}

  --o-hosp: #d8d0c0; --o-temp: #ef6f61; --o-teut: #e2b33f; --o-carm: #c99a6c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 6px 18px rgba(0, 0, 0, .5); --ctrl-filter: invert(.9); color-scheme: dark; } }

html { cursor: var(--quill); }
a, button, summary, select, label[for], input[type="checkbox"], input[type="range"] { cursor: var(--hand); }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--body); font-variant-numeric: tabular-nums; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

[hidden] { display: none !important; }
.eyebrow { font: 400 15px/1.15 var(--display); color: var(--rubric); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: var(--hand); font-size: 13px; }
.btn { border: 1px solid var(--rule); background: var(--paper); border-radius: 3px; padding: 5px 11px; cursor: var(--hand); font-size: 13px; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--purple); border-color: var(--purple); color: var(--on-purple); }
.dots { display: inline-flex; gap: 3px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
.dot.unc { background: transparent; border: 1.5px dashed var(--c); }
.tag { font: 500 11.5px var(--mono); padding: 2px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--ink); }
.tag.warn { background: var(--bad-soft); color: var(--bad); }
.tag.ok { background: var(--good-soft); }
.emblem { display: inline-block; vertical-align: middle; flex: none; }
.emblem.unc { opacity: .5; }
/* the theme switch: a candle standing in a small round-arched niche */
.theme-btn { width: 48px; height: 55px; flex: none; display: grid; place-items: end center; padding: 0 0 10px; border: 1px solid var(--rule); border-radius: 15px 15px 3px 3px; background: var(--paper); color: var(--ink); cursor: var(--hand); box-shadow: inset 0 0 0 2px var(--panel), inset 0 0 0 3px var(--rule); }
.theme-btn:hover { border-color: var(--accent); }

/* The flame flickers while it burns, shrinks into the wick when snuffed and leaves a thread of smoke; lighting it
   makes it spring back up and warms the niche. */
.theme-btn { position: relative; overflow: hidden; }
.theme-btn::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 36%, rgba(248, 214, 130, .75), transparent 62%); transition: opacity .5s; }
.theme-btn.snuffed::before { opacity: 0; }

.theme-btn .flame { transform-box: view-box; transform-origin: 10px 10.6px; transition: transform .38s cubic-bezier(.3, 1.6, .5, 1), opacity .2s; animation: candle-flicker 8s ease-in-out infinite; }
.theme-btn.snuffed .flame { transform: scale(0); opacity: 0; animation: none; transition: transform .28s ease-in, opacity .28s; }
.theme-btn .smoke { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; }
.theme-btn.snuffed .smoke { animation: candle-smoke 1.5s .15s ease-out forwards; }
.theme-btn .spark { opacity: 0; transform-box: view-box; transform-origin: 10px 9px; }
.theme-btn.lighting .spark { animation: candle-spark .5s ease-out; }
.theme-btn.lighting .flame { animation: candle-catch .85s cubic-bezier(.3, 1.3, .5, 1) both, candle-flicker 8s .85s ease-in-out infinite; }
.theme-btn:not(.snuffed)::before { animation: candle-glow-flicker 7s ease-in-out infinite; }
.theme-btn.lighting::before { animation: candle-glow .9s ease-out both, candle-glow-flicker 7s .9s ease-in-out infinite; }
@keyframes candle-spark { 0% { opacity: 0; transform: scale(.2); } 30% { opacity: 1; transform: scale(.8); } 100% { opacity: 0; transform: scale(1.5); } }
@keyframes candle-catch { 0%, 22% { transform: scale(0); opacity: 0; } 30% { transform: scale(.25); opacity: 1; } 62% { transform: scale(1.18, 1.3); } 80% { transform: scale(.94, .92); } 100% { transform: scale(1); opacity: 1; } }
@keyframes candle-glow { 0%, 22% { opacity: 0; transform: scale(.4); } 60% { opacity: 1; transform: scale(1.25); } 100% { opacity: 1; transform: scale(1); } }
/* A candle in still air: the flame leans and breathes slowly, while its shape drifts. */
@keyframes candle-flicker { 0%, 100% { transform: none; } 20% { transform: skewX(-1deg) scaleY(1.02); } 45% { transform: skewX(.8deg) scaleY(.99); } 70% { transform: skewX(1.2deg) scaleY(1.025); } 88% { transform: skewX(-.6deg) scaleY(1); } }
@keyframes candle-glow-flicker { 0%, 100% { opacity: 1; } 35% { opacity: .92; } 70% { opacity: .97; } }
@keyframes candle-smoke { 0% { stroke-dashoffset: 1; opacity: 0; } 25% { opacity: .9; } 70% { stroke-dashoffset: 0; opacity: .9; } 100% { stroke-dashoffset: 0; opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .theme-btn .flame, .theme-btn.lighting .flame, .theme-btn.lighting .spark, .theme-btn.lighting::before, .theme-btn:not(.snuffed)::before, .theme-btn.snuffed .smoke { animation: none; transition: none; } .theme-btn.snuffed .smoke { stroke-dashoffset: 0; opacity: .55; } }
.crumbs { display: flex; gap: 14px; font: 400 16px/1 var(--display); }

.crumbs a:hover { color: var(--accent); }
.crumbs a[aria-current] { color: var(--ink); }
/* the language switch: one niche with a reel of two capitals (D over E); the reel slides and tilts when it turns */
.lang { position: relative; overflow: hidden; flex: none; width: 30px; height: 34px; padding: 0; border: 1px solid var(--rule); border-radius: 15px 15px 3px 3px; background: var(--paper); box-shadow: inset 0 0 0 2px var(--panel), inset 0 0 0 3px var(--rule); cursor: var(--hand); display: block; }
.lang:hover { border-color: var(--accent); }

.lang .reel { position: absolute; left: 0; right: 0; top: 0; height: 200%; display: flex; flex-direction: column; transition: transform .6s cubic-bezier(.5, -0.4, .3, 1.35); }
.lang .reel > span { position: relative; flex: 1; display: grid; place-items: center; padding-top: 11px; font: 400 32px/1 "Uncial Antiqua", var(--display); color: #c24f26; -webkit-text-stroke: 1.5px #2a1a08; paint-order: stroke fill; filter: drop-shadow(0 1.5px 1px rgba(30, 18, 5, .45)); }
/* gold pearls beside the capital, as on a painted initial */

@keyframes lang-shuffle { 0%, 100% { rotate: 0deg; } 30% { rotate: -9deg; } 65% { rotate: 7deg; } }
@media (prefers-reduced-motion: reduce) { .lang .reel { transition: none; } .lang.shuffle .reel > span { animation: none; } }
/* the music switch: a niche like the language ones, holding a note; it rings when the music plays */
.music-btn { position: relative; overflow: hidden; width: 32px; height: 34px; flex: none; display: grid; place-items: center; padding: 3px 0 0; border: 1px solid var(--rule); border-radius: 16px 16px 3px 3px; background: var(--paper); box-shadow: inset 0 0 0 2px var(--panel), inset 0 0 0 3px var(--rule); color: var(--ink); cursor: var(--hand); }

.music-btn { overflow: visible; }

@keyframes note-rise { 0% { opacity: 0; transform: translate(0, 4px) scale(.6) rotate(0); } 20% { opacity: 1; } 70% { opacity: .9; } 100% { opacity: 0; transform: translate(-30px, -16px) scale(1.1) rotate(-18deg); } }

@media (prefers-reduced-motion: reduce) { .music-btn[aria-pressed="true"] .note { animation-name: note-fade; } }
.music-btn[aria-pressed="true"] > svg:first-child { opacity: 1; }
#ytHolder { position: fixed; width: 1px; height: 1px; left: -9999px; top: 0; overflow: hidden; }
/* The three little niches take the gabled front of the Torhalle at Lorsch: a pointed pediment over square shoulders. */
.theme-btn, .lang, .music-btn { position: relative; isolation: isolate; overflow: hidden; width: 48px; height: 55px; border: 0; border-radius: 0; background: none; box-shadow: none; }
.music-btn { overflow: visible; }
.theme-btn:hover, .lang:hover, .music-btn:hover { border-color: transparent; }
.gable { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; overflow: visible; }

.crumbs { margin-right: auto; }

/* The map fills the page; the finding aid floats over it as a glass panel, as in Cairometry. --inset-left is the
   strip the panel covers, so everything centred on the map is centred on the part that is actually visible. */
.app { position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; --aid-w: 328px; --aid-gap: 12px; --inset-left: calc(var(--aid-w) + 2 * var(--aid-gap)); }

.searchbar { --w: min(440px, calc(100% - var(--inset-left) - 232px)); position: absolute; top: 10px; left: max(50%, calc(var(--inset-left) + var(--w) / 2)); translate: -50% 0; width: var(--w); z-index: 650;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; box-shadow: var(--shadow); }

/* The panels are dressed like the entry page: each is a plate in a thin double frame, and the main panel

.timebar { --w: min(520px, calc(100% - var(--inset-left) - 24px)); position: absolute; bottom: 30px; left: max(50%, calc(var(--inset-left) + var(--w) / 2)); translate: -50% 0; width: var(--w); z-index: 600;
  background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--rule); border-radius: 4px; box-shadow: var(--shadow);

<body>
<div class="app">
  <aside class="aid" id="aid">
    <div class="aid-head">
      <div class="head-row"><nav class="crumbs" aria-label="Pages"><a href="./">Home</a><a href="houses.html">All houses</a></nav><button class="theme-btn" id="themeBtn" type="button"></button></div>
      <h1>Order Houses of Lower Saxony</h1>
      <div class="tally" id="tally"></div>
      <div class="mobile-tabs"><button class="btn" id="toggleAid">Hide filters</button></div>
    </div>
    <div class="aid-body">
      <section class="block">
        <div class="block-title"><h2>Orders</h2><button class="linkbtn" id="allOrders">Show all</button></div>
        <div class="orders" id="orders"></div>
      </section>
      <section class="block">
        <div class="block-title"><h2>House type</h2></div>
        <div class="chips" id="types"></div>
        <label class="toggle" for="onlyAccurate"><input type="checkbox" id="onlyAccurate"> Only exact locations</label>
        <label class="toggle" for="showExcluded"><input type="checkbox" id="showExcluded"> Show excluded entries</label>
      </section>
      <details class="listbox" id="listBox">
        <summary><span class="lb-title">Houses</span><span class="lb-count" id="listCount"></span><span class="lb-hint">Browse the list</span></summary>
        <ul class="list" id="list"></ul>
      </details>
    </div>
    <div class="aid-foot"><span>Export</span><span class="sp"></span>
      <button class="btn" id="dlOpen">Download…</button></div>
  </aside>
  <main class="mapwrap">
    <div id="map" role="application" aria-label="Map of order houses"></div>
    <details class="key" id="keyBox" open><summary>Symbols</summary><div id="key"></div></details>
    <div class="searchbar" id="searchbar">
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search a place, alias or office holder" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results">
      </label>
      <div class="results" id="results" role="listbox" hidden></div>
      <div class="search-hint" id="hint" hidden>Spelling-tolerant: try <button class="linkbtn" data-try="Kruzen">Kruzen</button>, <button class="linkbtn" data-try="Süpplingenburg">Süpplingenburg</button> or <button class="linkbtn" data-try="Burgsteinfurt">Burgsteinfurt</button>.</div>
    </div>
    <section class="timebar" id="timebar" aria-label="Time">
      <div class="year-row"><div class="year-ctl">
          <button class="step" id="yearMinus" type="button" aria-label="One year earlier" title="One year earlier (Shift: ten years)">−</button>
          <input class="year" id="yearInput" type="text" inputmode="numeric" maxlength="4" placeholder="All years" aria-label="Year" title="Type a year between 1150 and 1820" autocomplete="off">
          <button class="step" id="yearPlus" type="button" aria-label="One year later" title="One year later (Shift: ten years)">+</button>
          <small id="yearSub"></small></div>
        <div class="time-ctrl"><label class="toggle" for="useYear"><input type="checkbox" id="useYear"> Show one year</label>
          <button class="btn play" id="play" aria-pressed="false" title="Step through the years and watch houses appear when they are founded and disappear when they are dissolved"><svg viewBox="0 0 12 12" aria-hidden="true" id="playIcon"></svg><span id="playLabel"></span></button></div></div>
      <svg class="hist" id="hist" viewBox="0 0 520 46" preserveAspectRatio="none" aria-label="Houses active per decade"></svg>
      <input type="range" id="year" min="1150" max="1820" step="1" value="1300" aria-label="Year">
      <div class="time-note" id="timeNote" aria-live="polite"></div>
    </section>
    <div class="toast" id="toast" hidden></div>
    <dialog class="dl" id="dl" aria-labelledby="dlTitle">
      <form id="dlForm" method="dialog">
        <h2 id="dlTitle">Download</h2>
        <p id="dlCount"></p>
        <label for="dlName">File name</label>
        <div class="dl-name"><input id="dlName" type="text" autocomplete="off" spellcheck="false" maxlength="80"><span id="dlExt">.csv</span></div>
        <fieldset><legend>Format</legend>
          <label class="toggle" for="dlCsv"><input type="radio" name="dlFormat" id="dlCsv" value="csv" checked> CSV (opens in Excel)</label>
          <label class="toggle" for="dlMd"><input type="radio" name="dlFormat" id="dlMd" value="md"> Markdown table</label>
          <label class="toggle" for="dlPdf"><input type="radio" name="dlFormat" id="dlPdf" value="pdf"> PDF (to print or pass on)</label>
        </fieldset>
        <div class="dl-actions"><button type="button" class="btn" id="dlCancel">Cancel</button><button type="submit" class="btn primary" id="dlGo">Download</button></div>
      </form>
    </dialog>
  </main>
</div>

pingen. After the church was demoted to a chapel in the 13th century the chief Enno Cirksena gifted it to the order in 1433. Almost nothing is known about the motives. The papal agreement happened on the 10th of december 1433 through Pope Eugen IV. Two years later the founding of the convent was put infront of the council in Basel for the final decision. The general prior of the carmelites Johannes Faci as well as the provincial prior of the lowergerman order province Petrus von Neuenkirchen were instructed with the implementaion of the convent. Because of the bull of the council the founding year was set to 1435. The seizure only happenend in 1436. In the early spring of 1437 Pope Eugen IV. again confirmed the gift and had the conditions in Appingen checked by the abbot of the cistercians convent in Ihlow. In the same year Heidenricus Mynenbodt was put in as the procurator of the convent in Appingen. In 1438 Appingen was officially taken in as the 26. convent in the lowergerman province of the carmelites and Mynenbodt became a prior where he stood for the next 40 years. During its high time the convent had about 20 brothers. The prior after Mynenbodt, Arnold von Utrecht, was told in 1479 to intoduce inner reforms and the inner monastic life order. Johannes Kruse aus Emden who had the office of prior four times was close to Count Edzard der Große and worked as a connection between eastfrisia and the new count. With the reformation and count Enno II. the convent found an end. Together with that Appingen stood in the middle of a military conflict between Count Enno II. and Balthasar von Esens where five convents, under it Appingen and the nunnery in Dykhusen, were looted and destroyed. While the convent in Dykhusen was fully destroyed, the convent in Appingen must at least have been liveable because the dominican nuns moved to Appingen. The convent must have been mostly abandoned in that point of time. In the sources one brother is named for the trails involing the nuns and a priest in 1531 and who became the head of the convent in 1541. The few tries to gain the convent back for the carmelites didn't work. With the disbandment of the nunnery the convent came into the hands of the founder family Cirksena. 1805 the domain gained the title \"domain convent Appingen \".","architecture":null,"remains":null,"images":[],"literature":{"author":"Michael Hermann","heading":"Appingen – Karmeliten (Ca. 1200 bis Mitte 16. Jh.)","pages":"90–91"},"people":[{"name":"Albert von Aachen","role":"prior","years":"11436","raw":"Albert von Aachen, Praefectus (11436)","person":"P-008"},{"name":"Heidenricus Mynenbodt","role":"prior","years":"1437","raw":"Heidenricus Mynenbodt, Procurator (1437)","person":"P-157"},{"name":"Heidenricus Mynenbodt","role":"prior","years":"1438-1478","raw":"Heidenricus Mynenbodt (1438-1478)","person":"P-157"},{"name":"Arnold von Utrecht","role":"prior","years":"1479-1485","raw":"Arnold von Utrecht (1479-1485)","person":"P-025"},{"name":"Friedrich von Appingen","role":"prior","years":"1485-1488","raw":"Friedrich von Appingen (Greetsiel) (1485-1488)","person":"P-119"},{"name":"Cornelius von Oldenbosch","role":"prior","years":"1489-1491","raw":"Cornelius von Oldenbosch (1489-1491)","person":"P-064"},{"name":"Friedrich von Appingen","role":"prior","years":"1492-1500","raw":"Friedrich von Appingen (Greetsiel) (1492-1500)","person":"P-119"},{"name":"Johannes Kruse","role":"prior","years":"1500-1506","raw":"Johannes Kruse (1500-1506)","person":"P-267"},{"name":"Adolph von Osterhusen","role":"prior","years":"1506-1507","raw":"Adolph (Aylt) von Osterhusen (1506-1507)","person":"P-005"},{"name":"Johannes Kruse","role":"prior","years":"1507-1510","raw":"Johannes Kruse (1507-1510)","person":"P-267"},{"name":"Lübbert Sickingh","role":"prior","years":"1510-1513","raw":"Lübbert Sickingh (1510-1513)","person":"P-292"},{"name":"Friedrich von Appingen","role":"prior","years":"1513-1514","raw":"Friedrich von Appingen (Greetsiel) (1513-1514)", allers. The farm lost its independence latest in 1357. From the on it was managed by the Hospitaller commenda in Süpplingenburg. 1592 the Konsistorialsekretär Johann Molinus bought the property. In 1830 the town bought the property and divided it.","architecture":null,"remains":null,"images":[],"literature":{"author":"Berwinkel, Roxane","heading":"Emmerstedt – Templer, später möglicherweise Johanniter (Ca. 1250 bis 1312/57)","pages":"391-392"},"people":[{"name":"Johann de Bornstede","role":"commander","years":"around 1304","raw":"Johann de Bornstede (around 1304)","person":"P-228"}],"raw":{"id":"Temp_DE_","name":"Emmerstedt /Templars commenda","order":"Templers, later Hospitallers?","lat":52243,"lon":10960,"founded":"1250 – 1258","end":"1312 – 1357","municipality":"Emmerstedt","parish":null,"foundedClean":"c. 1250–1258","endClean":"c. 1312–1357","firstMentioned":"1258","lastMentioned":null,"firstClean":"1258","lastClean":null,"heading":"Ca. 1250 bis 1312/57","mother":"Hospitaller commenda in Süpplingenburg","people":"Commanders: Johann de Bornstede (around 1304)"}},{"id":"H-015","row":16,"merged":[],"place":"Esterwegen","aliases":[],"type":"commandery","community":"Male","status":"unreviewed","excludedReason":null,"periods":[{"order":"hosp","uncertain":false,"row":16,"start":1223,"end":1564,"approx":false,"startKind":"founded","endKind":"ended","startWritten":"1223","endWritten":"1564","unsureDates":false}],"locations":[{"lat":52.994,"lon":7.632,"accurate":true,"note":null}],"diocese":"Osnabrück","province":"Great Priory Germany","patron":"John Baptist","wikidata":"Q28977861","gsn":"376","founder":"Count Balduin von Bentheim","history":"Count Balduin von Bentheim gifted the hospitallers his property in Esterwegen in 1223 under the conditions that his parents and him are included in their infinite memory and that the counts heron hunter is housed by the hospitallers yearly from the 8th of september to the 11th of november. In 1227 bishop Otto von Osnabrück as the feudal lord allowed the gifting of the tithe to the commandery through the bishops ministerialis Udo von Braken. 1534 the olny people living in the commandery were the commander, 5 farm hands and 2 maids. After the death of the commander Heinrich von Warmelo Esterwegen lost its independece. 1573 it was incorporated into the commandary of Steinfurt and was supposed to be sold with the agreement of the provincial chapter because it allegedly fell into disrepair and was uninhabitable. The comannder of Steinfurt Heinrich von Hövel sold Esterwegen far below the value to his brother Hermann von Hövel for 2000 tolars. His brother then sold it to Margarethe Kottig in 1575, who was the wife and partner of the commander, and their kids. After the commander was removed 1584 because of his lifestyle and dubious asset managment, Esterwegen came to his daughter Beatrix and her husband Johannes Schultz, who assigned it to count Arnold von Bentheim, Tecklenburg und Steinfurt. 1589 it was then sold to Amos Crumminga for 6700 tolars who took it as fief from the count von Bentheim as well. The order as well as the provincial government of Münster tried to cancel the sale but didn't succeed.","architecture":"Construction of the commandery appears to have progressed rapidly following its foundation in 1223. The earliest descriptions date from the 17th century: the main building was a half-timbered house comprising 38 bays, was approximately 95 metres long, had a tiled roof and was partly built over a cellar. Inside were living quarters, bedrooms and storerooms. Kitchens, a small baking room and a whey cellar","remains":"used as a barn for animals, partly torn down in the 16th century for building materials, in 1709 rebuilt and fully torn down in 1895","images":[],"literature":{"author":"Dolle, Josef","heading":"Esterwegen – Johanniter (1223 bis 1564/75)","pages":"404-406"},"people":[{"name":"Johannes de Butere","role":"commander","years":"1352","raw":"Johannes de Butere (1352)","person":"P in 1336. Together with all the property the right to patronage was supposed to be given to the hospitallers in Brunswick as well. The prior of Brunswick and his convent were assigned to establish a convent with at least six conventmembers. After the death of the prior the convent in Fallersleben were supposed to vote a priest to be the next prior and merge with the convent in Brunswick. At least six priest were supposed to be in Fallersleben. Thus there were two different versions of how the founding was to be established. Either as an independent convent or a merging with the mother house in Brunswick under the same prior. Because there are no further mentions of a convent in Fallersleben neither of the versions seem to were used.","architecture":null,"remains":null,"images":[],"literature":{"author":"","heading":"In: Josef Dolle unter Mitarbeit von Dennis Knochenhauer (Hrsg.): Niedersächsisches Klosterbuch. Verzeichnis der Klöster, Stifte, Kommenden und Beginenhäuser in Niedersachsen und Bremen von den Anfängen bis 1810. Teil 1–4. Bielefeld 2012, S. .","pages":null},"people":[],"raw":{"id":"Hosp_DE_","name":"Fallersleben / Hospitallers commenda","order":"Hospitallers","lat":52417,"lon":10717,"founded":null,"end":null,"municipality":"Wolfsburg","parish":null,"foundedClean":null,"endClean":null,"firstMentioned":"3rd of July 1451","lastMentioned":"3rd of July 1451","firstClean":"1451","lastClean":"1451","heading":null,"mother":"Hospitaller commandery Brunswick","people":null}},{"id":"H-017","row":18,"merged":[],"place":"Gartow","aliases":[],"type":"commandery","community":"Male","status":"unreviewed","excludedReason":null,"periods":[{"order":"hosp","uncertain":false,"row":18,"start":1360,"end":1438,"approx":false,"startKind":"founded","endKind":"ended","startWritten":"1360","endWritten":"1438","unsureDates":false}],"locations":[{"lat":53.023,"lon":11.457,"accurate":true,"note":null}],"diocese":"Verden","province":"Great Priory Germnay","patron":"Georg","wikidata":"Q27998677","gsn":"384","founder":null,"history":"On the 1st May 1360 the hospitallers bought the part of the castle and of the city off of the Lords of the Schulenburg together with the additonal villages and properties like the island Krummendiek on the Elbe. The land and feudal sovereignty of Gartow was claimed by Duke Wilhelm von Braunschweig-Lüneburg who only sold it to the hospitallers in 1364 as a pawn. But already 1362 the first commander is named. 1371 Duke Magnus II. of Braunschweig-Lüneburg transferred the possession over the castle and city to the hospitallers. The main force behind the commandery seemed to be the nobility, as the first two commanders are from noble families. Sometimes the commanders worked as witnesses for processes. The commandery gained some attention when Bernhard von der Schulenburg, the Master of Knights of the Bailiwick of Brandenburg, took residency there. The castle was conquered by Duke Heinrich von Lüneburg after the Markgrave of Brandenburg made claims for Gartow. The position of the hospitallers is unclear. Later the commandery is back in the possesion of the hospitallers. 1438 the commandery Gartow with all attachments including the city was sold to Vicke von Bülow and Werner von der Schulenburg.","architecture":null,"remains":"Church burned down 1721","images":[],"literature":{"author":"Dolle, Josef","heading":"Gartow – Johanniter (1360/62 bis 1438)","pages":"461-463"},"people":[{"name":"Albrecht von Dannenberg","role":"commander","years":"1362","raw":"Albrecht von Dannenberg (1362)","person":"P-014"},{"name":"Bernhard von der Schulenburg","role":"commander","years":"1371-1392, † 1392","raw":"Bernhard von der Schulenburg (1371-1392, † 1392)","person":"P-043"},{"name":"Busso von Alvensleben","role":"commander","years":"1400","raw":"Busso von Alvensleben (1400)","person":"P-057"},{"name":"Nikolaus von Bülow","role":"commander","years":"1426","raw":"Nikolaus von Bülow (1426)","person":"P-319"},{"name":"NN von Roditz","role":"commander","years":"1428","raw":"NN von Roditz (1428)","person":"P-321"},{"name":"Heinrich von Redern","role":"commander","years":"1432","raw":"Heinrich von Redern (1432)","person":"P-174"}],"raw":{"id":"Hosp_DE_","name":"Gartow / Hospitallers","order":"Hospitallers","lat":53023,"lon":11457,"founded":"1360","end":"1438","municipality":"Gartow","parish":null,"foundedClean":"1360","endClean":"1438","firstMentioned":"1362","lastMentioned":"1373","firstClean":"1362","lastClean":"1373","heading":"1360/62 bis 1438","mother":null,"people":"commanders: Albrecht von Dannenberg (1362); Bernhard von der Schulenburg (1371-1392, † 1392); Busso von Alvensleben (1400); Nikolaus von Bülow (1426); NN von Roditz (1428); Heinrich von Redern (1432)"}},{"id":"H-018","row":19,"merged":[],"place":"Goslar","aliases":[],"type":"commandery","community":"Male","status":"unreviewed","excludedReason":null,"periods":[{"order":"hosp","uncertain":false,"row":19,"start":1214,"end":1531,"approx":false,"startKind":"founded","endKind":"ended","startWritten":"1214","endWritten":"1531","unsureDates":false}],"locations":[{"lat":51.909,"lon":10.418,"accurate":true,"note":null},{"lat":51.9048,"lon":10.4325,"accurate":true,"start":"1523","end":"1531","note":"Second location"}],"diocese":"Hildesheim","province":"Great Priory Germany","patron":"Holy sepulchre; John the Baptist","wikidata":"Q21157942","gsn":"84","founder":"unknown","history":"Nothing is known about the beginnigs of the commandery in Goslar and the founding year 1119 in the chronic of Goslar probaly stemms from a mistake. It is first mentioned as the place of issue for a charter; till it's destruction in the 16th century it consisted out of a small church and a prior house. As a priest commandery without a hospital it probably first was subordinate to the commander of the St. John hospital in Braunschweig later allegedly the commander of Süpplingburg. Both documented sometimes as responsible for the convent. Next to these priors autonomous commanders of the convent can be found as well. With or shortly after their founding the church of the order allegedly was given the parish rights of the suburban special legal district \"Kleinen Vogtei\" by the bishop Adelog of Hildesheim. An according record is missing but this claim is later used against the other parish districts of the city. A school of the hospitallers is passed on. Latest in the 15th century the order in Goslar began to be under pressure. To further extend the fortification the council pursued the moving of the order that was near the walls. The Prior Johannes von Dornthe was also publicly accused of murder and mismanagment. At the start of the 16th century the church was presumed as structural, staff and economical decrepit. The planned moving (1504-1510) was followed by the destruction after the coonflict between the city and Duke Heinricht dem Jüngeren (1527).The move of the members of the order in the former Beghard house \"Trollmönch\" as the new priory estate (1532) stayed an episode and the soon following selling of the properties by the patronage of Süpplingburg brought an end to the hospitallers in Goslar.","architecture":"The church is modelled on the Church of the Holy Sepulchre in Jerusalem, with a replica of the Holy Sepulchre inside. Two construction phases: the original building, followed by a Gothic reconstruction in the 13th century","remains":null,"images":["https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Heiliggrab_%28Goslar%29_03.jpg"],"literature":{"author":"Wilgeroth, Cai-Olaf","heading":"Goslar–Johanniter (Vor 1214 bis Mitte 16. Jh.)","pages":"519-522"},"people":[{"name":"Guncelinus","role":"sacerdos und provisor","years":"1249","raw":"Guncelinus, sacerdos und provisor (1249)","person":"P-147"},{"name":"Ludolf","role":"commander","years":"1291-1299","raw":"Ludolf, commander (1291-1299)","person":"P-296"},{"name":"Werenbold/Warmbold","role":"commander","years":"1304-1315","raw":"Werenbold/Warmbold, commander (1304-1315)","person":"P-363"},{"name":"Rudolf de Homenshusen","role":"commander","years":"1357,1367","raw":"Rudolf de Homenshusen, commander (1357,1367) [1358 de Omeshusen proven as the commander of Süpplingenburg]","person":"P-342"},{"name":"Rudolf von Sassenburg","role":"commander","years":"1373","raw":"Rudolf von Sassenburg, commander (1373)","person":"P-345"},{"name":"Albrecht Wyling","role":"prior","years":"1408","raw":"Albrecht Wyling, prior (1408)","person":"P-016"},{"name":"Henning Blomberg","role":"commander or prior","years":"1474","raw":"Henning Blomberg, Prior (1474)","person":"P-183"},{"name":"Johannes von Dornthen","role":"commander or prior","years":"1497-1498","raw":"Johannes von Dornthen , Prior (1497-1498)","person":"P-271"},{"name":"Maneke de Sculenborch","role":"computator","years":"1498","raw":"Maneke de Sculenborch, computator (1498) [1504 commander of Süpplingenburg]","person":"P-303"},{"name":"Klinkebyl","role":"procurator","years":"1498","raw":"Klinkebyl, procurator (1498)","person":"P-279"},{"name":"Johannes Engel","role":"prior","years":"1515","raw":"Johannes Engel, prior (1515)","person":"P-266"},{"name":"Engel Mews","role":"prior","years":"1523","raw":"Engel Mews, prior (1523)","person":"P-086"},{"name":"Balthazar Schrader","role":"prior and administrator","years":"1531","raw":"Balthazar Schrader, prior and administrator (1531)","person":"P-035"}],"raw":{"id":"Hosp_DE_","name":"Goslar / Hospitallers to the Holy Grave commenda","order":"Hospitallers","lat":51909,"lon":10418,"founded":"1214","end":"1531","municipality":"Goslar","parish":null,"foundedClean":"1214","endClean":"1531","firstMentioned":"1214","lastMentioned":null,"firstClean":"1214","lastClean":null,"heading":"Vor 1214 bis Mitte 16. Jh","mother":null,"people":"commanders and priors: Guncelinus, sacerdos und provisor (1249); Ludolf, commander (1291-1299); Werenbold/Warmbold, commander (1304-1315); Rudolf de Homenshusen, commander (1357,1367) [1358 de Omeshusen proven as the commander of Süpplingenburg]; Rudolf von Sassenburg, commander (1373); Albrecht Wyling, prior (1408); Henning Blomberg, Prior (1474); Johannes von Dornthen , Prior (1497-1498); Maneke de Sculenborch, computator (1498) [1504 commander of Süpplingenburg]; Klinkebyl, procurator (1498); Johannes Engel, prior (1515); Engel Mews, prior (1523); Balthazar Schrader, prior and administrator (1531);"}},{"id":"H-019","row":20,"merged":[],"place":"Goslar","aliases":[],"type":"commandery","community":"Male","status":"unreviewed","excludedReason":null,"periods":[{"order":"teut","uncertain":false,"row":20,"start":1227,"end":1399,"approx":true,"startKind":"founded","endKind":"ended","startWritten":"1227?","endWritten":"1361 – 1399","unsureDates":true}],"locations":[{"lat":51.904,"lon":10.427,"accurate":true,"note":null}],"diocese":"Hildesheim","province":"Bailiwick Saxony","patron":"Holy Spirit, Mary and Martin","wikidata":"Q28980090","gsn":"86","founder":"knight and citizen Giselbert","history":"The former imperial advocat Giselbert, a knight and citizen of Goslar, gifted the Teutonic Order the Hospital for the poor in 1227 which was donated by him. In the same year King Heinrich (VIII.) took the hospital under the protection of his empire and freed them from possible claims by the heirs of Giselbert. The hospital was under supervision of the abbots of Walkenried and Riddagshausen as well as the decan of St. Simon and Judas in Goslar. Shortly after the King gave the broters the chapel of the Holy Spirit by the Königsbrücke. The wealth which the founder hoped to gain through the brothers wasn't reached. It didn't help that the hospital was near the chapel of the holy spirit and it's decan was superior to the head of the hospital. It's slow downfall probably already began on the 1st of december 1254 when directly across from the hospital of the order a citizens hospital opened with the help of the chapter St. Simon and Judas. The citizen hospital soon surpassed the hospital of the order. 1280/81 the order gained the patronage over churches in Beuchte and Weddingen as well as property in Weddingen. The economic focus was shifted there and the commanders court slowly moved from Goslar to Weddingen. This process must have concluded in the end of the 14th century because the former house in Goslar and the hospital were taken over by Beguines. 1546 the order sold the \"Elisabeth-Haus\" to the city Goslar and it's chapel to to a citizen. Only a garden in Goslar stayed with the order till 1809.","architecture":null,"remains":"Livingquarters preserved","images":[],"literature":{"author":"Moritz, Thomas","heading":"Goslar - Deutscher Orden (1227 bis Ende 14. Jh.)","pages":"528-531"},"people":[{"name":"Konrad","role":"office holder","years":"1292-1293","raw":"Konrad (1292-1293)","person":"P-280"},{"name":"Arnold","role":"office holder","years":"1294-1297","raw":"Arnold (1294-1297)","person":"P-021"},{"name":"Buchard von Dreinleve","role":"office holder","years":"1299","raw":"Buchard von Dreinleve (1299)","person":"P-052"},{"name":"Konrad von Quedlinburg","role":"office holder","years":"1302-1304","raw":"Konrad von Quedlinburg (1302-1304)","person":"P-286"},{"name":"Heinrich von Barum","role":"office holder","years":"1315-1325","raw":"Heinrich von Barum (1315-1325)","person":"P-167"},{"name":"Johann Senkepil","role":"office holder","years":"1351","raw":"Johann Senkepil (1351)","person":"P-242"}],"raw":{"id":"Teut_DE_","name":"Goslar / Teutonic Order commenda","order":"Teutonic Order","lat":51904,"lon":10427,"founded":"1227?","end":"1361 – 1399","municipality":"Goslar","parish":null,"foundedClean":"1227 (?)","endClean":"c. 1361–1399","firstMentioned":"1227","lastMentioned":"1361","firstClean":"1227","lastClean":"1361","heading":"1227 bis Ende 14. Jh","mother":null,"people":"Konrad (1292-1293); Arnold (1294-1297); Buchard von Dreinleve (1299); Konrad von Quedlinburg (1302-1304); Heinrich von Barum (1315-1325); Johann Senkepil (1351)"}},{"id":"H-020","row":21,"merged":[],"place":"Göttingen","aliases":[],"type":"commandery","community":"Male","status":"unreviewed","excludedReason":null,"periods":[{"order":"teut","uncertain":false,"row":21,"start":1242,"end":1810,"approx":false,"startKind":"founded","endKind":"ended","startWritten":"1242","endWritten":"1810","unsureDates":false}],"locations":[{"lat":51.532,"lon":9.929,"accurate":true,"note":null}],"diocese":"Mainz","province":"Bailiwick Saxony","patron":"Cosmas and Damian (in Bilshausen); Maria (in Göttingen)","wikidata":"Q28977890","gsn":"388","founder":"Markgrave Heinrich of Meißen with Otto von Plesse","history":"In 1242 Markgrave Heinrich of Meißen gifted the Teutonic Order the church and further property in Bilshausen, that the noble man Otto of Plesse gave up for the order. 1266 the first commander appears. In 1318 Duke Otto der Milde of Braunschweig gifted the Order a part of the Neustadt and tgave the permission to wall up the house of the order. Since when the house was owned by the order is not known. When the Neustadt was sold to the city Göttingen the chapel of Mary and the property of the order stayed with them. While the estate in Bilshausen was sold the order bought property in the city of Göttingen and around it. On the estate only tow or three clergyman and two secular brothers were allowed to live. Since the reformation the council and the sovereign enlisted taxes from the commandery but their continuance wasn't questioned although they pushed for the employment of an evangelical preacher. Soon after the reformation must have found an entrance. 1731 the commandery joined the calenbergische knighthood to strengthen their position in the electorate. In 1810 the government of Westphalia had it auctioned off.","architecture":"The original church was a single-nave structure with no connection to the tower; it was extended to a three-nave church between 1330 and 1350. The commander’s building is an elongated, two-storey rubble-stone structure, approximately 40 metres in length. The eastern, older section has a cellar with a barrel vault, whilst the western section represents an early extension. Sandstone pilasters on the street and courtyard façades allow the original window arrangement to be reconstructed, featuring narrow lancet windows (in the eastern section) and Gothic pointed-arch windows (in the western section). The rafter roof, which had no purlins, comprised two courses of collar beams and was covered with so-called ‘nun’ and ‘monk’ tiles.","remains":null,"images":[],"literature":{"author":"Arndt, Betty","heading":"Göttingen – Deutscher Orden (!242 bis 1810)","pages":"464-468"},"people":[{"name":"Bodo","role":"commander","years":"1266","raw":"Bodo (1266),","person":"P-047"},{"name":"Dietrich von Mengershausen","role":"commander","years":"1278","raw":"Dietrich von Mengershausen (1278)","person":"P-071"},{"name":"Burchart von Winnigstede","role":"commander","years":"1323","raw":"Burchart von Winnigstede (1323)","person":"P-055"},{"name":"Johann Senkepil","role":"commander","years":"1353","raw":"Johann Senkepil (1353)","person":"P-242"},{"name":"Heinrich von Kitzleben","role":"commander","years":"1532","raw":"Heinrich von Kitzleben (1532)","person":"P-171"},{"name":"Johann von Steinhorst","role":"commander","years":"1622","raw":"Johann von Steinhorst (1622)","person":"P-258"},{"name":"Ludolph Klencke","role":"commander","years":"1630-1663","raw":"Ludolph Klencke (1630-1663)","person":"P-297"},{"name":"Wilhelm von Rheden","role":"commander","years":"1706","raw":"Wilhelm von Rheden (1706)","person":"P-369"},{"name":"Freiherr von Bothmer","role":"commander","years":"1729","raw":"Freiherr von Bothmer (1729)","person":"P-112"},{"name":"August Wilhelm von Grote","role":"commander","years":"1737","raw":"August Wilhelm von Grote (1737)","person":"P-028"},{"name":"Johann Friedrich Freiherr von Stein","role":"commander","years":"1767-1785","raw":"Johann Friedrich Freiherr von Stein (1767-1785)","person":"P-232"},{"name":"Philipp Otto Freiherr von Münchhausen","role":"commander","years":"1793","raw":"Philipp Otto Freiherr von Münchhausen (1793)","person":"P-331"},{"name":"Alexander Friedrich Wilhelm von Seckendorf","role":"commander","years":"1800-1801","raw":"Alexander Friedrich Wilhelm von Seckendorf (1800-1801)","person":"P-017"},{"name":"August Friedrich Wilhelm Freiherr von Woellwart","role":"commander","years":"1805","raw":"August Friedrich Wilhelm Freiherr von Woellwart (1805)","person":"P-026"},{"name":"Raban Freiherr von Spiegel zu Peckelsheim","role":"commander","years":"1808","raw":"Raban Freiherr von Spiegel zu Peckelsheim (1808)","person":"P-334"}],"raw":{"id":"Teut_DE_","name":"Göttingen / Teutonic Order commenda","order":"Teutonic Order","lat":51532,"lon":9929,"founded":"1242","end":"1810","municipality":"Göttingen","parish":null,"foundedClean":"1242","endClean":"1810","firstMentioned":"1278","lastMentioned":"1634","firstClean":"1278","lastClean":"1634","heading":"!242 bis 1810","mother":null,"people":"Commanders: Bodo (1266),; Dietrich von Mengershausen (1278); Burchart von Winnigstede (1323); Johann Senkepil (1353); Heinrich von Kitzleben (1532); Johann von Steinhorst (1622); Ludolph Klencke (1630-1663); Wilhelm von Rheden (1706); Freiherr von Bothmer (1729); August Wilhelm von Grote (1737); Johann Friedrich Freiherr von Stein (1767-1785); Philipp Otto Freiherr von Münchhausen (1793); Alexander Friedrich Wilhelm von Seckendorf (1800-1801); August Friedrich Wilhelm Freiherr von Woellwart (1805); Raban Freiherr von Spiegel zu Peckelsheim (1808)"}},{"id":"H-021","row":22,"merged":[],"place":"Hahn","aliases":[],"type":"commandery","community":"Male","status":"unreviewed","excludedReason":null,"periods":[{"order":"hosp","uncertain":false,"row":22,"start":1487,"end":1525,"approx":true,"startKind":"mentioned","endKind":"ended","startWritten":"1487","endWritten":"around 1525","unsureDates":false}],"locations":[{"lat":53.291,"lon":8.158,"accurate":false,"note":null}],"diocese":"Bremen","province":"Great Priory Germany","patron":null,"wikidata":"Q28981653","gsn":"928","founder":null,"history":"The Hahn farm was assigned to the parish of St. Ulrich's Church under the name \"Hona\" in 1059 as the property of the Rastede monastery. At the beginning of the 14th century the farm was still paying a tithe to the monastery. It was probably transferred to the Hospitallers in the course of the 14th century and assigned to the Bredehorn Monastery. The Johanniters apparently set up a chapel in Hahn. Hahn was first mentioned as a Johanniterhof in 1487, when Count Gerd von Oldenburg transferred the house in Hane with all its accessories as a lifetime fief to the Hospitaller priest Sievert Schmedes so that services could be held in the chapel and the order would be promoted.In 1503 Harbord von Snet(h)lage, the Balleier in Steinfurt and Commander in Lage, handed Hahn over to Count Johann V of Oldenburg, who in return freed the Commandery in Bredehorn from all services as well as the cattle and grain treasure. The ownership rights were clarified in this way, and the order probably did not suffer any damage by favoring Bredehorn. The service in Hahn's chapel was to continue to be held by a Hospitaller priest. During the Reformation the chapel in Hahn was abandoned. 1503 the farm which was ceded to the Counts of Oldenburg, was later converted into a count's farm and was owned by Count Anton Günther von Oldenburg.","architecture":null,"remains":null,"images":[],"literature":{"author":"Koolman, Egbert und Nistal, Matthias","heading":"Hahn – Johanniter (?). (Nach 1319 bis ca. 1525)","pages":"549-550"},"people":[{"name":"Hospitaller priest Sievert Schmedes","role":"head of the farm","years":"1487","raw":"Hospitaller priest Sievert Schmedes (1487)","person":"P-217"}],"raw":{"id":"Hosp_DE_","name":"Hahn / Hospitallers commenda","order":"Hospitallers","lat":53291,"lon":8158,"founded":null,"end":"around 1525","municipality":"Rastede","parish":null,"foundedClean":null,"endClean":"c. 1525","firstMentioned":"1487","lastMentioned":"1503","firstClean":"1487","lastClean":"1503","heading":"Nach 1319 bis ca. 1525","mother":"probably Bredehorn","people":"Head of the farm: Hospitaller priest Sievert Schmedes (1487)"}},{"id":"H-022","row":23,"merged":[],"place":"Hameln","aliases":[],"type":"commandery","community":"Male","status":"unreviewed","excludedReason":null,"periods":[{"order":"carm","uncertain":false,"row":23,"start":null,"end":1374,"approx":true,"startKind":null,"endKind":"ended","startWritten":null,"endWritten":"1342/74?","unsureDates":true}],"locations":[{"lat":52.103,"lon":9.354,"accurate":false,"note":null}],"diocese":"Minden","province":"Lowergerman province","patron":null,"wikidata":"Q28977921","gsn":"392","founder":null,"history":"In a charter from the 6th of December 1317 the chamber confirms the sale of half of the \"Werderinsel\" to the Carmelites. The brothers gained the permission to beg in the city and the people of Hameln were allowed to support the brothers with mild gifts, the brothers were allowed to built a way from the brige that touched the island and they were forbidden to find refuge in the city. Charters confirm a connection to the monastery in Marienau. The branch on the Werderinsel probably stemmed from Marienau. The settlement probably failed after the flood of the Weser in 1342 or 1374. The Carmelites of Marienau gained a \"Terminei\" in the city which was sold to the chamber in 1556.","architecture":null,"remains":"none","images":[],"literature":{"author":"Sonnenburg, Burghardt","heading":"Hameln – Karmeliter (?) (1317 bis 1342 oder 1374?)","pages":"565-566"},"people":[],"raw":{"id":"Carm_DE_","name":"Hameln / Carmelites commenda","order":"Carmelites","lat":52103,"lon":9354,"founded":null,"end":"1342/74?","municipality":"Hameln","parish":null,"foundedClean":null,"endClean":"c. 1342–1374 (?)","firstMentioned":null,"lastMentioned":null,"firstClean":null,"lastClean":null,"heading":"1317 bis 1342 oder 1374?","mother":null,"people":null}},{"id":"H-023","row":24,"merged":[],"place":"Hameln","aliases":[],"type":"commandery","community":"Male","status":"unreviewed","excludedReason":null,"periods":[{"order":"temp","uncertain":false,"row":24,"start":null,"end":1359,"approx":false,"startKind":null,"endKind":"ended","startWritten":null,"endWritten":"1359","unsureDates":false}],"locations":[{"lat":52.103,"lon":9.354,"accurate":false,"note":null}],"diocese":"Minden","province":"Alemania et Slavia","patron":null,"wikidata":"Q28977934","gsn":"393","founder":null,"history":"In march 1311 three brothers sold land to the monastery in Marienfeld land and two charters from the 25th and 26th of march 1311 confirmed that the brothers bought the land off of the Templers. It confirms that the Templers owend land in Hameln and makes a commandery possible even though it doesn't confirm it. The father of the brothers probably was the one to buy the land at the end of the 13th century and testified together with the grand master of the templers Widekind the confirmation of the cityrights of Hameln indront of Duke Albrecht II. of Barunschweig on the 18th of october 1277. The property probably was given to the Hospitallers who sold it to Siegfried von Homburg in 1359.","architecture":null,"remains":null,"images":[],"literature":{"author":"Sonnenburg, Burghardt","heading":"Hameln – Templer (?) (vor 1359?)","pages":"564-565"},"people":[],"raw":{"id":"Temp_DE_","name":"Hameln / Templars commenda","order":"Templers","lat":52103,"lon":9354,"founded":null,"end":"1359","municipality":"Hameln","parish":null,"foundedClean":null,"endClean":"1359","firstMentioned":null,"lastMentioned":null,"firstClean":null,"lastClean":null,"heading":"vor 1359?","mother":null,"people":null}},{"id":"H-024","row":25,"merged":[],"place":"Hasselt","aliases":[],"type":"double commandery","community":"Double","status":"unreviewed","excludedReason":null,"periods":[{"order":"hosp","uncertain":false,"row":25,"start":1319,"end":1558,"approx":true,"startKind":"founded","endKind":"ended","startWritten":"1319","endWritten":"1545 – 1558","unsureDates":false}],"locations":[{"lat":53.285,"lon":7.642,"accurate":true,"note":null}],"diocese":"Münster","province":"Greatpriory Germany","patron":"John Baptist","wikidata":"Q1780093","gsn":"401","founder":null,"history":"The place was initially in the possesion of the monastery of Werden and probably came through the bishop of Münster, who bought the fresian possesion of Werden, to the hospitallers. The convent bought a \"Vorwek\" in Nortmoor because the plains were not useable for livestock. The convent was inhabitet by brothers and sisters. 1447 members of the order were witnesses for the drafting of the will of the priest of Filsum. Eventhough 1499 the incorporation of Hesel, Boekzetel and Hasselt to Abbingwehr was planned this never happened. Hesel was incorporated to Hasselt before 1495 and Boekzetel followed soon. After 1500 Boekzetel and Stikelkamp probably also Hesel and Nortmoor were leased. After the secularization by Count Enno II. around 1528 only the commander Berend Buther and a few sisters lived in Hasselt. Shortly before spring 1528 the commander married, supposedly his mistress, but commited suicide shortly after due to pressure from the order. 1540 the former commandery was in the hands of Count Johann of Ostfriesland. The last member of the convent in Hasselt was probably the \"Beguine\" of Hasselt, who was given 12 guilders by the Countess Anna in 1545 to return back to her home. 1558 the building was torn down and used as a pasture for sheep. 1608 the commandery came back to the order. With Nortmoor, Hesel, Boekzetel and Stikelkamp the commandery made more income than Langholt and Burlage. A commander managed the commandery together with other houses of the order. During the thirty year war the \"Vorwerk\" of Hasselt was plundered by the troops of Count Ernst II. von Mansfeld. Because the order couldn't afford to rebuilt the farms they were leased. On the 26. of December 1806 the King of Holland gave the command to confiscate the commanderies in langholt and Hasselt.","architecture":null,"remains":null,"images":[],"literature":{"author":"Sgonina, Marc","heading":"Hasselt – Johanniter-Doppelkommende (Vor 1319 bis 1806)","pages":"600-603"},"people":[{"name":"Heinrich von Brabant","role":"commander","years":"1495","raw":"Heinrich von Brabant (1495)","person":"P-169"},{"name":"Berend Buther","role":"commander","years":"1522-1528","raw":"Berend Buther (1522-1528)","person":"P-038"},{"name":"Johann Sigismund Graf von und zu Schaesberg","role":"commander","years":"1703-1718","raw":"Johann Sigismund Graf von und zu Schaesberg, at the same time commander of Lage, Münster and Steinfurt (1703-1718)","person":"P-243"},{"name":"Johann Franz Freiherr von Freyberg","role":"commander","years":"1730","raw":"Johann Franz Freiherr von Freyberg (1730)","person":"P-231"},{"name":"Franz Josef Nicolaus de Griset de Forell","role":"commander","years":"1751-1755","raw":"Franz Josef Nicolaus de Griset de Forell (1751-1755)","person":"P-104"},{"name":"Maximilian Alexander Freiherr von Hornstein zu Weiterdingen","role":"commander","years":"1758-1798","raw":"Maximilian Alexander Freiherr von Hornstein zu Weiterdingen (1758-1798)","person":"P-308"},{"name":"Joseph Wilhelm Freiherr von Schauenburg zu Herlisheim","role":"commander","years":"1800-1815","raw":"Joseph Wilhelm Freiherr von Schauenburg zu Herlisheim (1800-1815)","person":"P-275"}],"raw":{"id":"Hosp_DE_","name":"Hasselt / Hospitallers doublecommenda","order":"Hospitallers","lat":53285,"lon":7642,"founded":"1319","end":"1545 – 1558","municipality":"Hesel","parish":null,"foundedClean":"1319","endClean":"c. 1545–1558","firstMentioned":"1319","lastMentioned":"1540","firstClean":"1319","lastClean":"1540","heading":"Vor 1319 bis 1806","mother":null,"people":"Commanders: Heinrich von Brabant (1495); Berend Buther (1522-1528); Johann Sigismund Graf von und zu Schaesberg, at the same construction possible. The commandery was one of the oldest branches of the Order of St. John in East Frisia. The order house was created through a gradual expansion of what was originally a small property in the town itself. In 1284, the commander of Steinfurt acquired the parish church of Holegaste for the commendary Jemgum. Jemgum was probably founded as a double commandery even though the presece of sisters is only proven since 1456. Jemgum gained an important role in East Frisia. As the only commandery in East Frsia the commander of Jemgum was involved in the conciliation between Groningen and Frsia in 1338. Jemgum also represented the Frisian Commissioner twice. In 1401 the Jemgum parish church and all of its lands were also incorporated. In 1482 Jemgum hosted the Frisian Provincial Chapter, the meeting of all Frisian commanders. After 1500 the order house was moved to Jemgumkloster three kilometers south of Jemgum. The monastery church stood empty after the largest part of Jemgums population changed to the teachings of the reformation. 1533 the soldiers of the Duke pillaged the commandery and the members of the order fled to the commandery in Muhde where they lived till 1540. The order only had the folwark Holtgast in Jemgum left where two sisters and a priest lived till 1540. 1561 the last commander sold the folwark.","architecture":null,"remains":null,"images":[],"literature":{"author":"Sgonina, Marc","heading":"Jemgum – Johanniter-Doppelkommende (ca. 1240 bis 1528)","pages":"864-867"},"people":[{"name":"Bernardu","role":"commander","years":"1401","raw":"Bernardu (1401)","person":"P-040"},{"name":"Ocko","role":"commander","years":"1409","raw":"Ocko (1409)","person":"P-323"},{"name":"Edzerde","role":"commander","years":"1436-1446, 1447-1471","raw":"Edzerde (1436-1446), Heuwo (1447-1471)","person":"P-078"},{"name":"Haye/Hayo Witlink/Huytting Hwyttynga","role":"commander","years":"1483-1503","raw":"Haye/Hayo Witlink/Huytting Hwyttynga (1483-1503)","person":"P- of Lage\", which, according to legend, was carved by the Hospitallers Johannes and Rudolf after a heavenly vision, began in the 14th century. The bishop of Osnabrück Dietrich von Horne (1376-1402) demanded tax payments from the Johanniters despite papal exemption. When they refused, the bishop attacked the Hospitallers house in Lage from his neighboring castle in Vörden on February 18, 1384, took the residents as prisoners, plundered the commandery and made them uninhabitable. Despite the excommunication imposed on him, it was not until 1395 that he agreed to make amends for the damage. The commendary only slowly recovered from this blow; in 1426 the church in Lage was newly consecrated by the Osnabrück auxiliary bishop. 1495 the convent consisted of a commander and five brothers. During the thirty year war Lage was occupied by the Swedes and the new commander Johann Jakob von Pallandt had all of the commandery buildings rebuilt. After the death of the last Hospitaller priest 1647 only the commander resided in the house of the order. The commandery Lage and the Benedictine nunnery Malgarten stayed as the only catholic institutions in the lutheran parish Bramsche. 1810 the commandery was abolished by Jerome Bonaparte in favour of the by him established for the \"Order of the Westphalian crown\" but the planned selling never happend.","architecture":"Renovation of the single-nave Gothic rubble-stone building with pointed three-part tracery windows; renovation began in 1659, and in 1733 the vault was fitted with a stucco ceiling","remains":null,"images":["https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/Rieste_kommende_lage_hohe_hase_10.jpg"],"literature":{"author":"Kraienhorst, Heinrich Bernhard","heading":"Lage – Johanniter (1245 bis 1810)","pages":"895-901"},"people":[{"name":"Albero","role":"commander","years":"1260","raw":"Albero (1260)","person":"P-006"},{"name":"Rudolfus","role":"commander","years":"1262","raw":"Rudolfus (1262)","person":"P-346"},{"name rtain":false,"row":37,"start":1319,"end":1528,"approx":false,"startKind":"mentioned","endKind":"ended","startWritten":"1319","endWritten":"1528","unsureDates":false}],"locations":[{"lat":53.113,"lon":7.591,"accurate":true,"note":null}],"diocese":"Münster","province":"Great Priory Germany","patron":"John Baptist","wikidata":"Q1639862","gsn":"839","founder":null,"history":"The commandery was probably founded at the same time as the Bokelesch branch by the commandery in Steinfurt. Langholt is only mentioned in the document of the Groninger Vergleich in 1319, but must have existed before 1270. Since the commandery borders the Niederstift Münster on two sides, problems often arose. Around 1465, the convent was robbed of all its livestock by the invasion of the Count of Tecklenburg. Even though the Münster troops were able to take the loot back from the Tecklenburger, the commandery had to pay the Drost of Münster Andreas von Langen 80 guilders in order to redeem their own cattle. The East Frisian chief Focko Ukena temporarily exercised patronage over the commandery Langholt, because in 1424 he commissioned the Langholt commander Memmo to rebuild the Thedinga monastery in Moormerland. After 1500, the Bishop of Münster, as in Dünebroek, tried to take advantage of the commanderies border location and feigned sovereign rights over Langholt using a presumably forged document. In 1510 the commandery placed itself under the jurisdiction of the Bishop of Münster. For the first time, sisters are now also mentioned. Langholt's church treasures were stolen in 1528. Since Geldrian troops pillaged Langholt, the Commander's House and other buildings of the commandery had to be rebuilt in 1533. In 1540, in addition to the commander, there was also a priest living in the commandery. Sisters were no longer present. Four or five farmhands looked after the fields and the 50 cows. Even though the priest Haye Schartebroch still lived in the commandery, there had been no commander since 1562. The priest had converted to Protestantism and became a recipient of orders from the count's chancellery. He probably died after 1562. The church and other buildings in Langholt were not demolished, but slowly fell into disrepair over the following decades. In 1608 the two large farms and the old manor house of the commandery Langholt had fallen into disrepair. A commander administered the commandery together with other religious house. The war led to severe damage to the order's possessions in East Frisia. In 1655, instead of the three houses from 1608, there was only one left in Langholt. In 1705, the Heuermann Michael Roewe was appointed as Langholt's manager by the Commander of Steinfurt. At the end of the 18th century, Langholt lost important moorland and land areas to a company that was commissioned by the Prussian administration to dry out the moor. Only on October 31. 1789 the order was able to gain back its land through a process. On December 26. 1806 the King of Holland gave the order for the Confiscation of the commanderies Langholt and Hasselt.","architecture":null,"remains":"destroyed","images":[],"literature":{"author":"Sgonina, Marc","heading":"Langholt – Johanniter-Doppelkommende (Vermutlich letztes Drittel 13. Jh. bis 1528/1806)","pages":"914-917"},"people":[{"name":"Memmo","role":"commander","years":"1424","raw":"Memmo (1424)","person":"P-311"},{"name":"Herher","role":"commander","years":"1495","raw":"Herher (1495)","person":"P-187"},{"name":"Jost Lamperts","role":"commander","years":"1510","raw":"Jost Lamperts (1510)","person":"P-276"},{"name":"Haye Schartebroch","role":"commander","years":"1540, 1562","raw":"Haye Schartebroch (1540, 1562)","person":"P-152"}],"raw":{"id":"Hosp_DE_","name":"Langholt / Hospitallers doublecommenda","order":"Hospitallers","lat":53113,"lon":7591,"founded":null,"end":"1528","municipality":"Langholt","parish":null,"foundedClean":null,"endClean":"1528","firstMentioned":"1319","lastMentioned":null,"firstClean":"1319","lastClean":null,"heading":"Vermutlich letztes Drittel 13. Jh. bis 1528/1806","mother":null,"people":"Commanders: Memmo (1424); Herher (1495); Jost Lamperts (1510); Haye Schartebroch (1540, 1562)"}},{"id":"H-035","row":38,"merged":[],"place":"Lemwerder","aliases":[],"type":"commandery","community":"Male","status":"unreviewed","excludedReason":null,"periods":[{"order":"hosp","uncertain":false,"row":38,"start":null,"end":null,"approx":false,"startKind":null,"endKind":null,"startWritten":null,"endWritten":null,"unsureDates":false}],"locations":[{"lat":53.158,"lon":8.617,"accurate":true,"note":null}],"diocese":"Bremen","province":"Great Priory Germany","patron":"John Baptist","wikidata":"Q28979743","gsn":"840","founder":null,"history":"A house of the Order of St. John, attested to at the end of the 13th century, which was equipped with a chapel and was headed by a brother Helmeric as procurator, was located iuxta Juvium qui dicitur Lesme. The commandery, which was only mentioned once, was perhaps not on the river, but opposite the Lesum, so on the western bank of the Weser at the level of the mouth of the Lesum, perhaps also near the Oldenburg castle Versfleth, which has been documented several times but is not otherwise located. The above mentioned documentary mention is so far the only one known.","architecture":null,"remains":null,"images":[],"literature":{"author":"Koolman, Egbert und Nistal, Matthias","heading":"Lemwerder – Johanniter (Ende 13. Jh.)","pages":"917-918"},"people":[],"raw":{"id":"Hosp_DE_","name":"Lemwerder / Hospitallers commenda","order":"Hospitallers","lat":53158,"lon":8617,"founded":null,"end":null,"municipality":"Lemwerder","parish":null,"foundedClean":null,"endClean":null,"firstMentioned":null,"lastMentioned":null,"firstClean":null,"lastClean":null,"heading":"Ende 13. Jh","mother":null,"people":null}},{"id":"H-036","row":39,"merged":[],"place":"Lucklum","aliases":[],"type":"commandery","community":"Male","status":"unreviewed","excludedReason":null,"periods":[{"order":"teut","uncertain":false,"row":39,"start":null,"end":1809,"approx":false,"startKind":null,"endKind":"ended","startWritten":null,"endWritten":"1809","unsureDates":false}],"locations":[{"lat":52.205,"lon":10.69,"accurate":true,"note":null}],"diocese":"Halberstadt","province":null,"patron":"Mary","wikidata":"Q28976596","gsn":"157","founder":"Bischof Volrad von Halberstadt","history":"The place was first mentioned as Lucgenheim in 1051. The earliest possessions in Lucklum were transferred to the Teutonic Order in 1260. The sex mansos in pago et in campo Luckenem were the basis for the landcommadery that subsequently emerged. In the beginning, particularly favored by Bishop Volrad von Halberstadt, the property in Lucklum and the surrounding area grew quickly. In 1263 the brothers were given the officium sive bona in Luckenem, the parish and the church itself as well as three farmsteads by the Halberstadt church. In the same year, Bishop Volrad expanded the order's property and rights to include the bailiwick and other lands in Lucklum.Before the order arrived, the place already had a market and a ducal Gogericht. Lucklum is conveniently located on an access road to the Deiweg, to the north (towards Altmark, Magdeburg, Baltic Sea etc.) and to the south (Harz). The castles in the Elm, which were also owned by the order (Elmsburg and Reitling), were more protected, but were inconvenient for traffic. The transfer of the headquarters from Elmsburg to Lucklum took place around 1264. Donations came mainly from nobles from the surrounding area, such as the Duke of Braunschweig and the counts from neighboring towns. But the brothers in Lucklum also received donations from Merseburg (1297). The order bought additional property, such as the Evesser Berg with tithes and all uses in 1265 or a farm and a mill in Lucklum in 1272. But possesions were also being sold. In 1280 the order received bailiwick rights to a property and was freed from the count status. In 1295 Duke Albrecht the Feist allowed the installation of a neck iron. In 1311 the order received full jurisdiction for Lucklum: omne iuset iurisdictio sanguinis, vitae et membrorum. The Lucklum parish was dissolved in 1314 and the church became the order's chapel through a privilege from the Halberstadt bishop. In 1316 the bishop of Halberstadt moved the seat of the ban and an archdeaconry from Lucklum to Evessen. At the beginning of the 14th century, the Teutonic Order took possession of the entire town of Lucklum.In 1313 the order was granted the rights to all Neubruch on its property by Bishop Albert von Halberstadt. A school building was also mentioned here for the first time a porticus scholae. In 1325 the order acquired the last farm in Lucklum. The brothers also acquired property in the immediate area, for example in Sickte, Veltheim, Hordorf and other places. In 1281 there was a conflict with the Duke of Braunschweig, who saw his right to build castles violated by the unauthorized expansion of the Lucklum court into a fortification. However, a settlement was agreed upon for a payment of 14 silver marks. The Duke and his brothers refrained from suing and promised to protect the order. This was repeated in 1295. In the 1320s, the expansion of the castle into a castle, including the church, was completed. In 1321, Duke Otto allowed two embrasures to be built and the gates to be closed, but emphasized that the order was not allowed to carry out any further fortification work without ducal permission. The Elmsburg attracted Duke Magnus l. in a dispute and lent it to the von der Asseburg family in 1355. In 1364 he gave it back to the landcommander Johann von Hagen, who resided in Lucklum, and also paid 100 marks in compensation to the order. The ownership of Elmsburg was given to the commandery Lucklum, and the castle itself was no longer used by the order, but was pledged and later lent out. Instead, the brothers bought Twieflingen Castle with the associated bailiwick, court and all rights from the Duke in 1370.The order's property had become so large in the 14th and 15th centuries that it could no longer be managed by the order alone. That's why they leased goods in Salzdahlum or land sold to farmers in 1385. There was still evidence of barter transactions up to the end of the Middle Ages, but there was hardly any expansion of ownership. In 1507, Duke Heinrich confirmed the order's old rights. In 1542 the Schmalkaldische League introduced the Reformation and visited the monasteries in the state of Braunschweig. The order was allowed to keep its property in Lucklum however, a Protestant preacher and teacher had to be hired. A forestry dispute around 1600 led to Lucklum being occupied in 1605 until the commander gave in. In the 16th century, 37 Hufen land was given to farmers, but almost all of the farms fell during the thirty year war. Because the commandery was heavely damaged during the war it was rebuilt by the landcommander Johann Daniel. In the 18th century the commandery reached its final structural stage. After the dissolution of the Teutonic Order in 1809 the Westphalian government initially negotiated a lease but the property was sold to the family Wahnschaffe in 1811.","architecture":null,"remains":null,"images":["https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Lucklum_Merian.png","https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Rittergut_Lucklum_Einfahrt_junge_Alleeb%C3%A4ume.jpg"],"literature":{"author":"Frey, Christian","heading":"Lucklum – Deutscher Orden (Ca. 1264 bis 1809)","pages":"934-938"},"people":[{"name":"Bodo de Wanzleve","role":"commander","years":"1275","raw":"Bodo de Wanzleve (1275)","person":"P-048"},{"name":"frater Wedde","role":"commander","years":"1283","raw":"frater Wedde (1283)","person":"P-109"},{"name":"frater Wedego","role":"commander","years":"1293","raw":"frater Wedego (1293)","person":"P-110"},{"name":"Olricus de Barum","role":"commander","years":"1308","raw":"Olricus (Ul ses":[],"type":"monastery","community":"Male","status":"unreviewed","excludedReason":null,"periods":[{"order":"carm","uncertain":false,"row":40,"start":null,"end":1565,"approx":false,"startKind":null,"endKind":"ended","startWritten":null,"endWritten":"1565","unsureDates":false}],"locations":[{"lat":52.11,"lon":9.57,"accurate":true,"note":null}],"diocese":"Hildesheim","province":"Lowergerman Province","patron":"Mary","wikidata":"Q1272588","gsn":"119","founder":"Counts of Spielbergwith help of the Noblemenof Homburg","history":"Marienau Monastery, the earliest Carmelite convent on Lower Saxony, was built at the beginning of the 14th century in what was then known as \"Ouhagen\" on the site of an older chapel that was already dedicated to Maria and her mother Anna. The monastery was first mentioned in 1312. The founding document was already considered lost in 1543. Based on the order in which the monastery appears in the order's older convent lists, it can be assumed that it was founded between the years 1306 and 1312, probably 1310. In a record from 1570 that was burned during the Second World War, the Counts of Spiegelberg were named as the donors of the monastery's land. A legend tells of a bloody act committed by the Homburgers against the Spiegelbergers, against the background of which the monastery is said to have come into contact with the Carmelite monastery in Kassel, which was founded with the collaboration of the Hessian landgrave in 1292. The first surviving documentary confirmation of a closer connection between the two the monasteries that weren't located near other branches of their order, dates back to 1324. In 1449 the monastery is said to have received a letter of protection from Duke Wilhelm the Elder from Braunschweig-Calenberg. The convent must have always consisted of around 20 brothers. At the end of the 14th century, the Marienau monks mostly came from the immediate vicinity of the monastery. With the prior and the terminating brothers occasionally a subprior, a custos, a procurator and a infirmary master are mentioned. Visitations were initially carried out by the prior of Kassel on behalf of the provincial prior, and later, especially in the 15th century, together with the convent of the Kassel monastery in Kassel. In 1492, 1494 and 1496 they took place there on the occasion of the provincial chapters taking place in Cologne. The considerable position that the monastery occupied in the order's province in the 14th century was not continued in the 15th century. The monastery school in Marienau was managed by the order province. The sources repeatedly report fire and war devastation. In 1432 and 1441, significant parts of the monastery archives were destroyed. The spread of the Lutheran movement in the Principality of Calenberg initially left the monastery unaffected, the Lutheran visitation scheduled by Duchess Elisabeth in 1543 could not do anything to change the Old Believer orientation of the monks. Two years later, the provincial Eberhard Billick implored the convent in a pastoral letter to remain with the Roman Church. However, due to the introduction of the Reformation in the cities in its territory and the abolition of the neighboring Kassel monastery in the domain of Landgrave Philipp der Großmütige of Hesse, the monastery became largely isolated. Its end came when the Catholic Duke Erich II of Calenberg took control of Marienau and pledged all of its possessions in 1565. The last monks then secretly brought livestock, food and other monastic goods to Hamelin and the monastery dissolved. Already at the end of the 16th century it was almost unknown to Lower Saxony historiography. The monastery land was pledged by the Lauenstein office until the 17th century, then leased in small pieces. Only the field name “Klosterbreite” has been preserved. The sovereign domain chamber remained responsible for the former monastery property.","architecture":null,"remains":null,"images":["https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/Kloster_Marienau_Geb%C3%A4ude.jpg"],"literature":{"author":"von Boetticher, Anette","heading":"Marienau – Karmeliter (Ca. 1310 bis ca. 1566)","pages":"990-995"},"people":[{"name":"Johann","role":"prior","years":"1324","raw":"Johann (1324)","person":"P-226"},{"name":"Johann von Minden","role":"prior","years":"1359","raw":"Johann von Minden (1359)","person":"P-253"},{"name":"Konrad von Oldendorf","role":"prior","years":"1361","raw":"Konrad von Oldendorf (1361)","person":"P-285"},{"name":"Heinrich von Oldendorf","role":"prior","years":"1363","raw":"Heinrich von Oldendorf (1363)","person":"P-173"},{"name":"Friedrich von Himmelfeldt","role":"prior","years":"1363","raw":"Friedrich von Himmelfeldt (1363)","person":"P-121"},{"name":"Konrad von Rinteln","role":"prior","years":"1365","raw":"Konrad von Rinteln (1365)","person":"P-287"},{"name":"Konrad von Oldendorf","role":"prior","years":"1366","raw":"Konrad von Oldendorf (1366)","person":"P-285"},{"name":"Johann von Diest","role":"prior","years":"1367","raw":"Johann von Diest (1367)","person":"P-247"},{"name":"Johann von Münder","role":"prior","years":"1370","raw":"Johann von Münder (1370)","person":"P-254"},{"name":"Hermann von Hameln","role":"prior","years":"1374","raw":"Hermann von Hameln (1374)","person":"P-204"},{"name":"Johann von Hildesheim","role":"prior","years":"before 1375 (according to his epitaph, the third prior)","raw":"Johann von Hildesheim ( before 1375 (according to his epitaph, the third prior))","person":"P-249"},{"name":"Gerhard von Göttingen","role":"prior","years":"1375","raw":"Gerhard von Göttingen (1375)","person":"P-139"},{"name":"Albert von Stockem","role":"prior","years":"1377","raw":"Albert von Stockem (1377)","person":"P-009"},{"name":"Johann von Münder","role":"prior","years":"1378","raw":"Johann von Münder (1378)","person":"P-254"},{"name":"Ludwig von Zierenberg","role":"prior","years":"1381","raw":"Ludwig von Zierenberg (1381)","person":"P-300"},{"name":"Johann
